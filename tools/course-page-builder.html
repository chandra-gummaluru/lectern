const tTarget = ev => { if (!tdrag) return null; const x = ev.target.closest && ev.target.closest(tdrag.kind === "col" ? "[data-tcol]" : "[data-trow]"); return x && (x.dataset.tcol || x.dataset.trow) === tdrag.t ? x : null; };

const statusEl = $("#status");

function updateStatus() {
  // A page pulled from GitHub shows its path there; "not pushed" until it's pushed back.
  const where = gh.path ? gh.path : fileName;
  statusEl.innerHTML = (where ? `<span class="st-path" title="${esc(where)}">${esc(where)}</span>` : "") +
    (unsaved ? `<span class="st-pill">${WARN_ICON}${notSaved()}</span>` : "");
}
function markChanged() { unsaved = true; updateStatus(); }

function placeCaretEnd(el) {
  try { const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (_) {}
}

function render(focusPath) {
  fitAll(model); fitTables(model);
  if (!model.evalFiles) model.evalFiles = {};
  if (typeof leaveHome === "function" && view === "home" && booted) leaveHome();
  const y = window.scrollY;
  if (ui.page && !getP(model, ui.page)) ui.page = parentPage(ui.page);
  if (ui.page && !getP(model, ui.page)) ui.page = "";
  if (ui.page) { EDIT = true; stage.innerHTML = pageHTML(ui.page); EDIT = false; if (stage.querySelector(".e-rich")) document.execCommand("defaultParagraphSeparator", false, "p"); }
  else stage.innerHTML = HV() ? hubEditor() : renderPage(model, ui.mode === "edit");
  stage.classList.toggle("edit", ui.mode === "edit");
  stage.classList.toggle("hbe-on", !ui.page && !!HV());
  stage.querySelectorAll("textarea.e-md").forEach(autosize);
  window.scrollTo(0, y);
  updateStatus();
  Object.entries(tsel).forEach(([p, x]) => { const el = stage.querySelector(`[data-bind="${CSS.escape(x.r < 0 ? `${p}.columns.${x.c}` : `${p}.rows.${x.r}.${x.c}`)}"]`), cell = el && el.closest("td, th"); if (cell) cell.classList.add("e-tsel"); });
  if (focusPath) {
    const el = stage.querySelector(`[data-bind="${focusPath}"], [data-bindv="${focusPath}"], [data-bindt="${focusPath}"]`) || stage.querySelector(`[data-bind^="${focusPath}."]`);
    if (el) { el.focus(); if (el.matches("input, textarea")) el.select(); else placeCaretEnd(el); el.scrollIntoView({ block: "nearest" }); }   // a box: select what's in it, ready to type
  }
}

// A structural change: snapshot for undo, apply, redraw.
function change(fn, focusPath) {
  flushTyping();
  undoStack.push(JSON.stringify(model)); if (undoStack.length > 100) undoStack.shift();
  redoStack = [];
  fn();
  unsaved = true;
  render(focusPath);
}

// Typing: one undo step per burst, without redrawing under the caret.
function noteTyping() {
  if (!typingSnap) typingSnap = JSON.stringify(model);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(flushTyping, 900);
}
function flushTyping() {
  clearTimeout(typingTimer);
  if (typingSnap && typingSnap !== JSON.stringify(model)) {
    undoStack.push(typingSnap); if (undoStack.length > 100) undoStack.shift(); redoStack = [];
  }
  typingSnap = null;
  updateStatus();
}
function undo() { flushTyping(); if (!undoStack.length) return; redoStack.push(JSON.stringify(model)); model = JSON.parse(undoStack.pop()); unsaved = true; render(); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(model)); model = JSON.parse(redoStack.pop()); unsaved = true; render(); }

stage.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind) {
    noteTyping(); setP(model, el.dataset.bind, el.textContent.replace(/\n+/g, " ")); markChanged();
    const m = /^(.*)\.rows\.(\d+)\.\d+$/.exec(el.dataset.bind), t = m && getP(model, m[1]);
    if (t && Number(m[2]) === t.rows.length - 1 && !rowEmpty(t.rows[t.rows.length - 1])) render(el.dataset.bind);   // the spare row is in use: a new spare under it
  }
  else if (el.dataset.bindv) { noteTyping(); setP(model, el.dataset.bindv, el.value.trim()); markChanged(); if (ui.page) refreshPageBits(); }
  else if (el.dataset.rich) { noteTyping(); setP(model, el.dataset.rich, richToMd(el)); markChanged(); }
  else if (el.dataset.bindt) { noteTyping(); setP(model, el.dataset.bindt, el.value); autosize(el); markChanged(); if (ui.page) refreshPageBits(); }
});
function autosize(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; }

stage.addEventListener("keydown", e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.bind) return;
  const path = el.dataset.bind;
  if (e.key === "Enter") {
    e.preventDefault();
    if (el.dataset.item) {   // Enter in a bullet or paragraph starts the next one
      const m = path.match(/^(.*)\.(\d+)$/), list = m[1], i = Number(m[2]);
      change(() => getP(model, list).splice(i + 1, 0, ""), `${list}.${i + 1}`);
    } else el.blur();
  } else if (e.key === "Backspace" && el.dataset.item && el.textContent.trim() === "") {
    const m = path.match(/^(.*)\.(\d+)$/), list = m[1], i = Number(m[2]);
    if (getP(model, list).length > 1) { e.preventDefault(); change(() => getP(model, list).splice(i, 1), `${list}.${Math.max(0, i - 1)}`); }
  } else if (e.key === "Escape") el.blur();

stage.addEventListener("click", e => {

function makeItem(kind, list) {
  const arr = getP(model, list);
  switch (kind) {
    case "week": {
      const real = arr.filter(w => !w.isBreak), prev = real[real.length - 1];
      const w = { label: nextLabel(prev && prev.label, `Week ${real.length + 1}`), dates: "", start: "", end: "", topic: "", deadlines: [], announcements: [], cards: [] };
      // Dates follow on from the last dated week (a section divider takes no time).
      const k = arr.map(x => !x.isBreak && !!x.start).lastIndexOf(true);
      if (k >= 0) setRange(w, ...weekAfter(arr[k].start, arr[k].end, arr.slice(k).filter(x => !x.isBreak).length));
      return w;
    }
    case "break": return { isBreak: true, text: "" };
    case "card": {
      const all = model.sections.filter(s => s.type === "schedule").flatMap(s => s.weeks.flatMap(w => w.cards || []));
      return newCard(nextLabel((arr[arr.length - 1] || all[all.length - 1] || {}).label, "Lecture 01"));
    }
    case "deadline": return "";
    // e.g. "Oct 15, 2026, 15:42"
    case "ann": return { title: "", at: Date.now(), date: nowStamp(), body: "" };
    case "row": return getP(model, list.replace(/\.rows$/, "")).columns.map(() => "");
    case "group": return { name: "", extra: "", slots: [{ a: "", b: "" }] };
    case "slot": return { a: "", b: "" };
    case "meeting": { const last = arr[arr.length - 1]; return last ? { ...newMeeting(last.kind), day: last.day, where: last.where, who: last.who } : newMeeting(); }
    case "block": return { heading: "", body: "" };
    case "tblock": return { heading: "", table: { columns: ["Column 1", "Column 2", "Column 3"], rows: [["", "", ""]], footer: null } };
    case "file": return { label: arr.length ? "" : /^evalFiles\./.test(list) ? "Handout" : "Download", url: "" };
  }
}

const NOUN = { announcement: "Announcement", break: "Section divider", card: "Lecture", lecture: "Lecture", "file or link": "File or link", week: "Week", row: "Row", section: "Section", "text block": "Text block", table: "Table", deadline: "Deadline", time: "Time", file: "File" };
const FOCUS = { tblock: ".heading", break: ".text", card: ".title", week: ".dates", deadline: "", row: ".0", group: ".name", slot: ".a", block: ".body" };

function act(d) {
  const path = d.path, i = Number(d.i);
  switch (d.act) {
    case "move": { const j = i + Number(d.d); if (ui.page === `${path}.${i}`) ui.page = `${path}.${j}`; change(() => { const a = getP(model, path); [a[i], a[j]] = [a[j], a[i]]; }); break; }
    case "del": if (path === "sections" && model.sections[i] && (["scheme", "policies", "meetings"].includes(model.sections[i].type) || isContact(model.sections[i]))) { const ty = isContact(model.sections[i]) ? "contact" : model.sections[i].type; model.removed = [...new Set([...(model.removed || []), ty])]; }
      if (ui.page === `${path}.${i}` || ui.page.startsWith(`${path}.${i}.`)) ui.page = parentPage(`${path}.${i}`); change(() => getP(model, path).splice(i, 1)); toast(`${NOUN[d.noun] || "Item"} deleted`, true); break;
    case "add": {
      // Weeks opened from older pages may not have an announcements list yet.
      if (!getP(model, path)) setP(model, path, []);
      const arr = getP(model, path);
      if (d.kind === "ann") {   // a new announcement, dated now, opens its page (an empty one is dropped when you leave)
        pageScroll[ui.page || "~"] = window.scrollY; change(() => arr.push({ title: "", date: nowStamp(), at: Date.now(), body: "" })); delete pageScroll[`${path}.${arr.length - 1}`]; goPage(`${path}.${arr.length - 1}`);
        const t = stage.querySelector(`[data-bindv="${ui.page}.title"]`); if (t) t.focus(); break;
      }
      if (d.kind === "card" || d.kind === "week") {   // a new card or week opens its page
        pageScroll[ui.page || "~"] = window.scrollY; change(() => arr.push(makeItem(d.kind, path))); delete pageScroll[`${path}.${arr.length - 1}`]; goPage(`${path}.${arr.length - 1}`);
        const t = stage.querySelector(`[data-bindv="${ui.page}.${d.kind === "card" ? "title" : "topic"}"]`); if (t) t.focus();
        break;
      }
      change(() => arr.push(makeItem(d.kind, path)), d.kind === "file" ? null : `${path}.${arr.length}${FOCUS[d.kind] ?? ""}`);
      if (d.kind === "file") { const inp = stage.querySelector(`[data-bindv="${path}.${arr.length - 1}.label"]`); if (inp) { inp.focus(); inp.select(); } }
      if (d.kind === "block") { const ta = stage.querySelector(`[data-bindt="${path}.${arr.length - 1}.body"]`); if (ta && !document.activeElement.dataset.bind) ta.focus(); }
      break;
    }
    case "lec-off": { const w = getP(model, path); change(() => { w.off.push(w.hours); fitWeek(w); }); break; }
    case "lec-on": { const w = getP(model, path), at = Number(d.at), n = Number(d.n) || 1; change(() => { w.off = w.off.filter(h => h < at || h >= at + n); fitWeek(w); }); break; }
    case "lec-add": {   // a new lecture at the end of the week, numbered after the lecture before it; it opens its page
      const w = getP(model, path), at = w.hours, j = w.cards.length;
      let before = j ? w.cards[j - 1] : null;   // else the last lecture of an earlier week
      if (!before) weeks: for (const sec of model.sections) if (sec.type === "schedule") for (const x of sec.weeks) { if (x === w) break weeks; if (x.cards && x.cards.length) before = x.cards[x.cards.length - 1]; }
      const c = Object.assign(newCard(nextLabel(before && before.label, "Lecture 01")), { at, hours: 1 });
      pageScroll[ui.page || "~"] = window.scrollY;
      change(() => { w.cards.splice(j, 0, c); fitWeek(w); });
      goPage(`${path}.cards.${j}`);
      const t = stage.querySelector(`[data-bindv="${ui.page}.title"]`); if (t) t.focus();
      break;
    }
    case "lec-hours": { const c = getP(model, path), w = getP(model, path.replace(/\.cards\.\d+$/, "")); change(() => { c.hours = Math.max(1, Math.min(MAXH, c.hours + Number(d.d))); fitWeek(w); }); break; }
    case "lec-move": {   // swap with the neighbouring lecture: the pair keeps the hours it covered, in the new order
      const w = getP(model, path.replace(/\.cards\.\d+$/, "")), j = Number(path.split(".").pop()), k = j + Number(d.d);
      const [a, b] = k < j ? [w.cards[k], w.cards[j]] : [w.cards[j], w.cards[k]];
      if (!a || !b) break;
      change(() => { const start = a.at, gap = b.at - (a.at + a.hours); b.at = start; a.at = start + b.hours + gap; w.cards.sort((x, y) => x.at - y.at); });
      ui.page = `${path.replace(/\.\d+$/, "")}.${k}`; render();
      break;
    }
    case "edit-grades": if (editGrades) editGrades(d.v); break;
    case "preview": flushTyping(); dropEmptyAnn(); ui.preview = ui.preview ? null : "in"; ui.week = null; render(); window.scrollTo(0, 0); break;
    case "preview-as": ui.preview = d.v; render(); break;
    case "tab": flushTyping(); dropEmptyAnn(); ui.tab = d.v; ui.week = null; ui.page = ""; render(); window.scrollTo(0, 0); break;

// ═════════════════════════════════════════════════════════════════════
// GitHub: Pull a course page (<course>/<term>/info.html) from a repo,
// edit it here, and Push it back as a commit. GitHub Pages then
// republishes the site on its own.
// ═════════════════════════════════════════════════════════════════════
const GH_KEY = "course-page-builder.github";
// The course page is its data: Lectern's course hub is built from course.json. Older pages are an
// info.html (the page as HTML, for Quercus), which opens (read back into data) and saves as course.json.
const PAGE_FILE = "course.json", OLD_FILE = "info.html";

function ghLoad() {

  if (saved) Object.assign(gh, { repo: saved.repo || "", branch: saved.branch || "main", token: saved.token || "" });

function ghSave(remember) {

  try { (remember ? localStorage : sessionStorage).setItem(GH_KEY, v); } catch (_) {}
}

// Accepts "owner/repo", "github.com/owner/repo" or a full URL.
function parseRepo(s) {

// UTF-8-safe base64, which the GitHub contents API uses for file bodies.

      ...opts,

    });

    404: "Not found. Check the repository name and branch, and that the token has access to this repository.",

function pagesURL(path) {

// ═════════════════════════════════════════════════════════════════════
// Where pages live: a local folder (usually the git clone of the course
// repository) or the GitHub repository itself. Everything that lists,
// reads or saves pages goes through these few functions.
// ═════════════════════════════════════════════════════════════════════
const SRC_KEY = "course-page-builder.source";

// dir = the folder in use; waiting = a remembered folder the browser must be asked about again;
// site = the GitHub Pages address the folder publishes to (from its git remote), for links.
const src = { mode: "github", dir: null, waiting: null, name: "", site: "" };
const srcReady = () => src.mode === "local" ? !!src.dir : ghReady();
const srcLabel = () => src.mode === "local" ? src.name : gh.repo;
let GH_NAME = "GitHub";   // hosted by Lectern (its server): "Lectern"
const notSaved = () => src.mode === "local" || !gh.path ? "Unsaved" : `Not saved to ${GH_NAME}`;

// The folder survives a restart in the browser's IndexedDB (a handle, not the files).
function idb(op, val) {

      const r = indexedDB.open("course-page-builder", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onerror = () => res(null);
      r.onsuccess = () => {
        try {
          const st = r.result.transaction("kv", op === "get" ? "readonly" : "readwrite").objectStore("kv");
          const q = op === "put" ? st.put(val, "dir") : op === "del" ? st.delete("dir") : st.get("dir");
          q.onsuccess = () => res(q.result || null); q.onerror = () => res(null);

function siteFor(repo) {
  const [owner, name] = repo.split("/"), host = `${owner.toLowerCase()}.github.io`;
  return name.toLowerCase() === host ? `https://${host}/` : `https://${host}/${name}/`;
}
async function useFolder(h) {

    const m = /\[remote "origin"\][^[]*?url\s*=\s*(\S+)/.exec(cfg), repo = m ? parseRepo(m[1]) : "";

async function chooseFolder() {

}
async function reconnectFolder() {

}
async function srcLoad() {

}
function setSource(mode) {

// Local files, by repo-style path ("csc108/f26/info.html").
async function dirAt(parts, create) { let d = src.dir; for (const p of parts) d = await d.getDirectoryHandle(p, { create: !!create }); return d; }

    const folder = sel.value === "__new" ? $("#fp-new", m).value.trim() : sel.value === "__top" ? "" : sel.value;
    const path = [dir, folder, file.name].filter(Boolean).join("/");
    pending.set(path, file);
    closeModal(); setFile(filePath, path);
    toast(files.some(f => f.path === path && !f.waiting) ? `${file.name} will replace the existing copy when you save.` : `${file.name} will be added when you save.`);
  };
}

// ── Save to GitHub ───────────────────────────────────────────────────
// A File's contents as base64, for the GitHub blob API.
const fileB64 = file => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(",")[1] || "");
  r.onerror = () => rej(new GhError(0, `Couldn't read ${file.name} from your computer. Choose it again.`));
  r.readAsDataURL(file);
});

// One commit with the page and every waiting upload (git data API:
// blobs → tree → commit → move the branch). Saving back to the page that
// was opened checks it hasn't changed on GitHub in the meantime.
async function doSave(m, path, message, overwrite) {
  const ok = $("#pl-ok", m), err = $("#pl-err", m);
  const step = t => { ok.textContent = t; };
  ok.disabled = true; step("Saving…"); err.className = "err"; err.textContent = "";
  const R = `/repos/${gh.repo}`;
  if (src.mode === "local") return saveLocal(m, path, overwrite);
  try {
    const head = (await ghApi(`${R}/git/ref/heads/${encodeURIComponent(gh.branch)}`)).object.sha;
    const baseTree = (await ghApi(`${R}/git/commits/${head}`)).tree.sha;
    if (!overwrite) {
      let current = null;
      try { current = (await ghApi(`${R}/contents/${encPath(path)}?ref=${head}`)).sha; }
      catch (e) { if (e.status !== 404) throw e; }
      if (current !== gh.sha) throw new GhError(409, "conflict");
    }
    const ups = usedUploads(), entries = [];
    for (let k = 0; k < ups.length; k++) {
      const [p, file] = ups[k];
      step(`Uploading ${k + 1} of ${ups.length}…`);
      const blob = await ghApi(`${R}/git/blobs`, { method: "POST", body: JSON.stringify({ content: await fileB64(file), encoding: "base64" }) });
      entries.push({ path: p, mode: "100644", type: "blob", sha: blob.sha });
    }
    step("Saving…");
    const page = await ghApi(`${R}/git/blobs`, { method: "POST", body: JSON.stringify({ content: pageData(), encoding: "utf-8" }) });
    entries.push({ path, mode: "100644", type: "blob", sha: page.sha });
    const tree = await ghApi(`${R}/git/trees`, { method: "POST", body: JSON.stringify({ base_tree: baseTree, tree: entries }) });
    const commit = await ghApi(`${R}/git/commits`, { method: "POST", body: JSON.stringify({ message, tree: tree.sha, parents: [head] }) });
    try { await ghApi(`${R}/git/refs/heads/${encodeURIComponent(gh.branch)}`, { method: "PATCH", body: JSON.stringify({ sha: commit.sha }) }); }
    catch (e) { if (e.status === 422) throw new GhError(0, `Something else was saved to ${GH_NAME} at the same moment. Press Save again.`); throw e; }

    gh.path = path; gh.sha = page.sha; fileName = ""; unsaved = false;
    pending.clear();   // sent, or no longer linked from the page
    render();
    const url = pagesURL(path);
    m.innerHTML = `<h2>Saved</h2>
      <p><code>${esc(path)}</code> is saved on ${GH_NAME}. ${GH_NAME === "GitHub" ? "The live page updates in a minute or two" : "The live page is up to date"}:</p>
      <p><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></p>
      <div class="row"><button type="button" class="primary" id="ps-done">Done</button></div>`;
    $("#ps-done", m).onclick = closeModal; $("#ps-done", m).focus();
  } catch (e) {
    ok.disabled = false; ok.textContent = "Save to GitHub";
    if (e.status === 409) {   // the page changed on GitHub since it was opened
      err.className = ""; err.innerHTML = notice(`<b>This page changed on ${GH_NAME} since you opened it.</b> <a href="#" id="ps-over">Replace ${GH_NAME}'s version with yours</a>, or cancel and open it again to see the other changes. Undo brings yours back.`);
      $("#ps-over", m).onclick = ev => { ev.preventDefault(); doSave(m, path, message, true); };
    } else err.textContent = e.message;
  }
}
// The same for a local folder: write the uploads, then the page, straight into it.
async function saveLocal(m, path, overwrite) {
  const ok = $("#pl-ok", m), err = $("#pl-err", m);
  try {
    if (!overwrite && gh.sha) {   // changed in the folder since it was opened?
      let cur = null; try { cur = (await readLocal(path)).version; } catch (_) {}
      if (cur !== gh.sha) throw new GhError(409, "conflict");
    }
    const ups = usedUploads();
    for (let k = 0; k < ups.length; k++) { ok.textContent = `Copying ${k + 1} of ${ups.length}…`; await writeLocal(ups[k][0], ups[k][1]); }
    ok.textContent = "Saving…";
    await writeLocal(path, pageData());
    gh.path = path; gh.sha = (await readLocal(path)).version; fileName = ""; unsaved = false;
    pending.clear();
    render();
    const live = liveURL(path);
    m.innerHTML = `<h2>Saved</h2>
      <p><code>${esc(path)}</code> is saved in <b>${esc(src.name)}</b>${ups.length ? `, with ${ups.length === 1 ? "1 new file" : `${ups.length} new files`}` : ""}. Commit and push with git to publish it${live ? ` to <a href="${esc(live)}" target="_blank" rel="noopener">the live page</a>` : ""}.</p>
      <div class="row"><button type="button" class="primary" id="ps-done">Done</button></div>`;
    $("#ps-done", m).onclick = closeModal; $("#ps-done", m).focus();
  } catch (e) {
    ok.disabled = false; ok.textContent = "Save to folder";
    if (e.status === 409) {
      err.className = ""; err.innerHTML = notice(`<b>This page changed in the folder since you opened it.</b> <a href="#" id="ps-over">Replace that version with yours</a>, or cancel and open it again to see the other changes. Undo brings yours back.`);
      $("#ps-over", m).onclick = ev => { ev.preventDefault(); doSave(m, path, "", true); };
    } else err.textContent = e && e.name === "NotAllowedError" ? "The browser didn't allow writing to this folder. Reconnect it on the start screen." : (e.message || "Couldn't write to the folder.");
  }
}

// What a parsed page holds, for the card's chips.
function pageStats(page) {
  const weeks = page.sections.filter(s => s.type === "schedule").flatMap(s => s.weeks.filter(w => !w.isBreak));
  const cards = weeks.reduce((n, w) => n + (w.cards || []).length, 0);
  const anns = weeks.reduce((n, w) => n + (w.announcements || []).length, 0);
  const cur = pickWeek(weeks.map(w => w.start || w.dates), pageYear(page), new Date());
  return { weeks: weeks.length, cards, anns, current: cur >= 0 && weeks.length ? weeks.at(cur).label : "" };
}

  $("#h-meta").textContent = `${pages.length} page${pages.length === 1 ? "" : "s"} in ${srcLabel()}`;
  list.innerHTML = `<div class="home-grid">${info.map((p, k) => {
    const st = p.page ? pageStats(p.page) : null;
    const title = p.page && p.page.title || p.c;
    const sub = p.page ? (p.page.term || "") : "Couldn't be read by the builder";
    const live = liveURL(p.path);
    const ico = cardIcon(p.path || p.c + p.t);
    return `<div class="pcard" role="button" tabindex="0" data-k="${k}" aria-label="Open ${esc(p.c)} ${esc(p.t)}">
      <div class="pcard-strip"><span>${esc(p.c)}/${esc(p.t)}</span></div>
      <div class="pcard-body">
        <span class="pcard-ico" aria-hidden="true">${ico.svg}</span>
        <h3 class="pcard-title">${esc(title)}</h3>
        <p class="pcard-sub">${esc(sub)}</p>
      </div>
      <div class="pcard-foot"><span>${p.saved ? `Saved ${esc(fmtDay(p.saved))}` : ""}</span>${live ? `<a href="${esc(live)}" target="_blank" rel="noopener" data-live="1">Live page ${HICON.out}</a>` : ""}</div>
    </div>`;
  }).join("")}${newCard}</div>`;
  wire();
  list.querySelectorAll(".pcard[data-k]").forEach(el => {
    const go = e => { if (e.target.closest("[data-live]")) return; openFromHome(info.at(Number(el.dataset.k))); };
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(e); } });
  });
}

// Open a page straight from its card (already fetched for the card, so no wait).
function openFromHome(p) {
  if (!p.page) return toast(`${p.path} wasn't made with this builder, so it can't be opened for editing.`);
  if (unsaved) undoStack.push(JSON.stringify(model));
  fetchPage(p.path).then(({ page, sha }) => {
    model = page; gh.path = p.path; gh.sha = sha; fileName = ""; unsaved = false; ui.collapsed.clear();
    render(); toast(`Opened ${p.path}`);
  }).catch(e => toast(e.message));
}
// New page: a new term of an existing course, or a new course.
function newPageFlow() { pullDialog(); }
$("#home-btn").addEventListener("click", () => { dropEmptyAnn(); ui.page = ""; showHome(); });
function dropEmptyAnn() {   // an announcement left with no title and no message isn't kept
  const m = /^(.*\.announcements)\.(\d+)$/.exec(ui.page || ""); if (!m) return;
  const a = getP(model, ui.page); if (a && !String(a.title || "").trim() && !String(a.body || "").trim()) getP(model, m[1]).splice(Number(m[2]), 1);
}

// ═════════════════════════════════════════════════════════════════════
// The path strip under the top bar (the same in all three builders):
// Home › the open file's folder › the builder's own path (the page's
// .crumbs, or the view it's on). Inside Lectern, Lectern draws its own.
// ═════════════════════════════════════════════════════════════════════
if (!(window.Lectern && window.Lectern.hosting)) (() => {
  const nav = $("#pathbar"); if (!nav) return;
  let raf = 0, steps = [];
  function drawPath() {
    const tb = $(".tb"), home = !$("#home").hidden;
    document.documentElement.style.setProperty("--tb0", `${tb && !tb.hidden ? tb.offsetHeight : 0}px`);
    steps = [{ label: "Home", go: home ? null : () => $("#home-btn").click() }];
    if (!home) {
      steps.push({ label: gh.path ? gh.path.split("/").slice(0, -1).join(" / ") : fileName || "Untitled" });
      const cr = [...document.querySelectorAll("#stage .crumbs")].find(n => !n.closest("[hidden]"));
      const seg = document.querySelector("#tb-view .seg button[aria-pressed='true']");
      if (cr) [...cr.children].forEach(n => { if (n.matches("button")) steps.push({ label: n.textContent.trim(), go: () => n.click() }); else if (n.matches(".cur")) steps.push({ label: n.textContent.trim() }); });
      else if (seg) steps.push({ label: seg.textContent.trim() });
    }
    nav.classList.toggle("on-home", home);
    nav.innerHTML = steps.map((s, k) => {
      const last = k === steps.length - 1, t = esc(s.label);
      return (!last && s.go ? `<button type="button" class="pb-s" data-k="${k}" title="${t}">${t}</button>` : `<span class="pb-s${last ? " cur" : ""}"${last ? ' aria-current="page"' : ""} title="${t}">${t}</span>`) + (last ? "" : '<span class="pb-sep" aria-hidden="true">›</span>');
    }).join("");
    nav.scrollLeft = nav.scrollWidth;   // on a narrow screen, the end of the path is what shows
  }
  nav.addEventListener("click", e => { const b = e.target.closest("button[data-k]"); if (b && steps[Number(b.dataset.k)].go) steps[Number(b.dataset.k)].go(); });
  new MutationObserver(recs => {
    if (recs.every(r => nav.contains(r.target))) return;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(drawPath);
  }).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["hidden", "aria-pressed"] });
  addEventListener("resize", drawPath);
  drawPath();
})();

// ═════════════════════════════════════════════════════════════════════
// Lectern: when Lectern hosts this builder, it hands over the connection
// (a GitHub sign-in or a local folder) and opens files itself, so the
// builder's own start screen and saved token aren't used. Opened on its
// own, the builder starts exactly as before.
// ═════════════════════════════════════════════════════════════════════
const lectern = window.Lectern && window.Lectern.hosting ? window.Lectern : null;
if (lectern) {
  render();
  booted = true;
  lectern.register("course", {
    // c: { mode: "github", repo, branch, token } or { mode: "local", dir (the public repo's folder), site }
    connect(c) {
      if (c.mode === "local") Object.assign(src, { mode: "local", dir: c.dir, waiting: null, name: c.dir.name, site: c.site || "" });
      else { src.mode = "github"; Object.assign(gh, { repo: c.repo, branch: c.branch || "main", token: c.token, site: c.site || "" }); GH_NAME = c.token === "session" ? "Lectern" : "GitHub"; }
    },
    // Open <course>/<term>/info.html; a new one starts blank or from another term's page (minus announcements).
    async open(folder, has, copyFrom) {
      const path = `${folder}/${PAGE_FILE}`;
      let page, sha = null;
      if (has) ({ page, sha } = await fetchPage(path));
      else if (copyFrom) {
        page = (await fetchPage(`${copyFrom}/${PAGE_FILE}`)).page;
        page.sections.forEach(sec => (sec.weeks || []).forEach(w => { if (w.announcements) w.announcements = []; }));
      }
      else page = BLANK_PAGE();
      if (unsaved) undoStack.push(JSON.stringify(model));
      model = page; gh.path = path; gh.sha = sha; fileName = ""; unsaved = !sha; ensureMeetings(model); ui.collapsed.clear(); ui.page = ""; ui.tab = "overview"; ui.week = null; ui.preview = null;   // no sha: new, or an older page (info.html) that saves as course.json
      leaveHome(); render();
    },
    // Lectern's one Save: save to where it is, without the dialog. → { ok } or { conflict } or { error }
    async save(message, overwrite = false) {
      if (!gh.path || !unsaved) return { ok: true };
      const m = document.createElement("div");
      m.innerHTML = `<button id="pl-ok"></button><p id="pl-err"></p>`;
      quietSave = true;
      try { await doSave(m, gh.path, message, overwrite); } finally { quietSave = false; }
      if (!unsaved) return { ok: true };
      if ($("#ps-over", m)) return { conflict: true };
      return { error: $("#pl-err", m).textContent || "Couldn't save." };
    },
    state: () => ({ path: gh.path, unsaved }),
    setLectures(l) { lecturesPart = l; if (!ui.page) render(); },
    // Where it is (the course page, a week, a lecture…), and going back there: Lectern's Back and Forward.
    where: () => ({ page: ui.page || "", tab: ui.tab }),
    goto(l) { flushTyping(); dropEmptyAnn(); if (l.tab) ui.tab = l.tab; if (!l.page || getP(model, l.page)) goPage(l.page || ""); },
    top() { flushTyping(); dropEmptyAnn(); goPage(""); },
    // The gradebook's marking scheme and evaluations (null: none, so keep what the page has). A change
    // to them changes the published page, so the page then needs saving.
    setScheme(sc, opts = {}) {
      editGrades = opts.edit || null;
      // A section you deleted stays deleted (model.removed); otherwise the Marking Scheme and Policies are there.
      const gone = model.removed || [], has = model.sections.some(x => x.type === "scheme") || gone.includes("scheme");
      const needPol = sc && !model.sections.some(x => x.type === "policies") && !gone.includes("policies");
      if (!sc || (has && !needPol && JSON.stringify(model.scheme) === JSON.stringify(sc))) { render(); return; }
      change(() => {
        model.scheme = sc;
        if (!has) {   // it takes the place of a hand-made Grading table, or goes after the schedule
          const sec = { id: uid(), type: "scheme", title: "Marking Scheme", caption: "Each evaluation, its weight and when it is", open: false };
          const k = model.sections.findIndex(x => x.type === "table" && /grad|mark/i.test(x.title));
          const j = model.sections.findIndex(x => x.type === "schedule");
          if (k >= 0) model.sections.splice(k, 1, sec); else model.sections.splice(j + 1, 0, sec);
        }
        if (needPol) {   // a Policies section: a hand-made one becomes it (its text blocks are your own policies), or it goes after the marking scheme
          const k = model.sections.findIndex(x => x.type === "text" && /polic/i.test(x.title));
          if (k >= 0) Object.assign(model.sections[k], { type: "policies", show: {}, blocks: (model.sections[k].blocks || []).filter(b => (b.heading || "").trim() || (b.body || "").trim()) });
          else model.sections.splice(model.sections.findIndex(x => x.type === "scheme") + 1, 0, { id: uid(), type: "policies", title: "Policies", caption: "Course rules, and what to do if you miss work", open: false, show: {}, blocks: [] });
        }
      });
    },
  });
} else {
  ghLoad();
  render();
  booted = true;
  srcLoad().finally(showHome);
}
})();
</script>
