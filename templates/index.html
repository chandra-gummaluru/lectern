<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lectern — {{ institution }}</title>
    <meta name="theme-color" content="#333333">
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/static/css/splash.css">
    <link rel="stylesheet" href="/static/css/shell.css">
    <script src="/static/js/boot.js"></script>
</head>
<body>
    <!-- ── Splash: one family with Beamer+ and Test Mail (serif wordmark, institution, a live preview,
         an outline watermark), with its own look: a centred title over one wide, wordless window. ── -->
    <div class="splash" id="splash">
        <div class="sp-watermark" aria-hidden="true">
            <svg viewBox="0 0 120 120">
                <g transform="translate(60, 64) rotate(-8) scale(1.05)">
                    <polygon points="-38,-30 38,-42 40,-32 -36,-20"/>
                    <polygon points="-5,-25 5,-27 5,34 -5,34"/>
                    <polygon points="-24,34 24,34 28,42 -28,42"/>
                </g>
            </svg>
        </div>

        <main class="sp-screen">
            <header class="sp-copy">
                <h1 class="sp-title">Lectern</h1>
                <p class="sp-inst">{{ institution }}</p>
                <p class="sp-tag">Every course, from the first lecture to the final mark.</p>

                <!-- Sign in. The other steps (a two-factor code, a forgotten password, an invitation) are drawn
                     in #sp-panel by auth.js. The password goes only to this server, over HTTPS. -->
                <form class="sp-form" id="sp-form" action="#" method="post" novalidate>
                    <label class="sp-field"><span>Email</span>
                        <input type="email" id="sp-email" name="email" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
                    <label class="sp-field"><span>Password</span>
                        <span class="sp-pw"><input type="password" id="sp-pw" name="password" autocomplete="current-password" required><button type="button" class="sp-show" data-show="sp-pw" aria-label="Show password">Show</button></span></label>
                    <button type="submit" class="sp-btn sp-btn--primary" id="sp-go">Sign in</button>
                    <button type="button" class="sp-link" id="sp-forgot">Forgot your password?</button>
                </form>
                <div class="sp-form" id="sp-panel" hidden></div>
                <div class="sp-under">
                    {% if learn_more %}
                    <a class="sp-more" href="{{ learn_more }}" target="_blank" rel="noopener">Learn more</a>{% endif %}
                </div>
                <p class="sp-hint" id="splash-status" role="status" aria-live="polite"></p>
            </header>

            <!-- One wide window, drawn in outline: the weeks, the spread of marks, a page of the exam.
                 No words; the only colour is the gold. A pen traces the curve and ticks the page. -->
            <figure class="sp-preview" aria-hidden="true">
                <svg class="sp-win" viewBox="0 0 960 360" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <rect class="w-frame" x="8" y="8" width="944" height="344" rx="24"/>
                    <path class="w-rule" d="M8 58H952"/>
                    <circle class="w-dot" cx="42" cy="33" r="6"/><circle class="w-dot" cx="64" cy="33" r="6"/><circle class="w-dot" cx="86" cy="33" r="6"/>

                    <!-- the weeks -->
                    <rect class="w-card" x="32" y="82" width="272" height="70" rx="10"/>
                    <rect class="w-ln" x="52" y="104" width="96" height="9" rx="4.5"/>
                    <rect class="w-ln2" x="52" y="124" width="150" height="7" rx="3.5"/>
                    <rect class="w-chip" x="252" y="110" width="12" height="12" rx="3"/><rect class="w-chip" x="268" y="110" width="12" height="12" rx="3"/>

                    <rect class="w-card is-sel" x="32" y="167" width="272" height="70" rx="10"/>
                    <rect class="w-ln dk" x="52" y="189" width="120" height="9" rx="4.5"/>
                    <rect class="w-ln2" x="52" y="209" width="110" height="7" rx="3.5"/>
                    <rect class="w-gold" x="230" y="194" width="34" height="14" rx="7"/>
                    <rect class="w-chip" x="268" y="195" width="12" height="12" rx="3"/>

                    <rect class="w-card" x="32" y="252" width="272" height="70" rx="10"/>
                    <rect class="w-ln" x="52" y="274" width="80" height="9" rx="4.5"/>
                    <rect class="w-ln2" x="52" y="294" width="170" height="7" rx="3.5"/>
                    <rect class="w-chip" x="252" y="280" width="12" height="12" rx="3"/><rect class="w-chip" x="268" y="280" width="12" height="12" rx="3"/>

                    <!-- the spread of marks -->
                    <rect class="w-card" x="328" y="82" width="304" height="240" rx="12"/>
                    <rect class="w-head" x="352" y="104" width="84" height="16" rx="5"/>
                    <rect class="w-ln2" x="446" y="108" width="40" height="8" rx="4"/>
                    <rect class="w-bar" x="356" y="236" width="28" height="22" rx="3"/>
                    <rect class="w-bar" x="392" y="218" width="28" height="40" rx="3"/>
                    <rect class="w-bar w-gold" x="428" y="190" width="28" height="68" rx="3"/>
                    <rect class="w-bar" x="464" y="160" width="28" height="98" rx="3"/>
                    <rect class="w-bar" x="500" y="140" width="28" height="118" rx="3"/>
                    <rect class="w-bar" x="536" y="182" width="28" height="76" rx="3"/>
                    <rect class="w-bar" x="572" y="214" width="28" height="44" rx="3"/>
                    <path class="w-rule" d="M350 258H610"/>
                    <path class="w-pen p1" pathLength="1" d="M352 252C392 246 420 214 452 172S502 116 520 124 552 172 572 200 598 238 612 244"/>
                    <rect class="w-ln2" x="352" y="282" width="150" height="7" rx="3.5"/><rect class="w-chip" x="594" y="279" width="14" height="12" rx="3"/>
                    <rect class="w-ln2" x="352" y="302" width="110" height="7" rx="3.5"/><rect class="w-chip" x="594" y="299" width="14" height="12" rx="3"/>

                    <!-- a page of the exam -->
                    <rect class="w-tray" x="656" y="82" width="272" height="240" rx="12"/>
                    <path class="w-sheet" d="M684 321V100H900V321"/>
                    <rect class="w-head" x="760" y="116" width="64" height="10" rx="5"/>
                    <path class="w-rule dk" d="M702 140H882"/>
                    <rect class="w-chip" x="702" y="156" width="8" height="8" rx="2"/>
                    <rect class="w-ln" x="718" y="156" width="124" height="8" rx="4"/>
                    <rect class="w-ln2" x="862" y="157" width="18" height="6" rx="3"/>
                    <rect class="w-gold-bg" x="702" y="176" width="180" height="30" rx="2"/>
                    <path class="w-gold-edge" d="M703 177V205"/>
                    <rect class="w-gold-ln" x="714" y="187" width="118" height="8" rx="4"/>
                    <rect class="w-chip" x="702" y="224" width="8" height="8" rx="2"/>
                    <rect class="w-ln" x="718" y="224" width="104" height="8" rx="4"/>
                    <rect class="w-ln2" x="862" y="225" width="18" height="6" rx="3"/>
                    <rect class="w-box" x="702" y="246" width="180" height="40" rx="3"/>
                    <path class="w-pen p2" pathLength="1" d="M724 270L736 280 762 254"/>
                </svg>
            </figure>
        </main>
    </div>

    <!-- ── The app: one top bar (with the path in it), then a page or a builder ── -->
    <div class="lt-app" id="app" hidden>
        <header class="lt-bar" id="lt-bar" role="toolbar" aria-label="Lectern">
            <button type="button" class="lt-home" id="lt-home" title="Home: all courses" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5"/></svg></button>
            <nav class="lt-path" id="lt-path" aria-label="Where you are"></nav>
            <span class="lt-status" id="lt-status"></span>
            <span class="lt-acct-wrap"><button type="button" class="lt-acct" id="lt-acct" aria-haspopup="menu" aria-expanded="false"></button></span>
        </header>
        <main class="lt-page" id="lt-page"></main>
        <div class="lt-tools" id="lt-tools"></div>
    </div>
    <div id="lt-modal-root"></div>
    <div id="lt-toast-root"></div>

    <script src="/static/js/scope.js"></script>
    <script src="/static/js/hub-view.js"></script>
    <script type="module" src="/static/js/lectern.js"></script>
</body>
</html>
