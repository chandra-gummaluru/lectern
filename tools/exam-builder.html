      try { current = (await ghApi(`${R}/contents/${encPath(path)}?ref=${head}`)).sha; }
      catch (e) { if (e.status !== 404) throw e; }
      if (current !== gh.sha) throw new GhError(409, "conflict");
    }
    const all = (await ghApi(`${R}/git/trees/${baseTree}?recursive=1`)).tree;
    const oldDir = examDir();
    const entries = [], texs = texFiles(slug), made = new Set(texs.map(f => `${dir}/${f.name}`));
    const ups = usedUploads().map(([p, f]) => [`${dir}/${p.slice(oldDir.length + 1)}`, f]);
    for (let k = 0; k < ups.length; k++) {
      const [p, file] = ups[k];
      step(`Uploading ${k + 1} of ${ups.length}…`);
      const blob = await ghApi(`${R}/git/blobs`, { method: "POST", body: JSON.stringify({ content: await fileB64(file), encoding: "base64" }) });
      entries.push({ path: p, mode: "100644", type: "blob", sha: blob.sha });
    }
    step("Saving…");
    const from = gh.copyFrom || (oldDir && oldDir !== dir ? oldDir : "");
    if (from) all.filter(t => t.type === "blob" && t.path.startsWith(`${from}/figures/`)).forEach(t => {
      const p = `${dir}/${t.path.slice(from.length + 1)}`;
      if (!entries.some(x => x.path === p) && !all.some(x => x.path === p)) entries.push({ path: p, mode: "100644", type: "blob", sha: t.sha });
    });
    // The tool's own copy of the class goes into every exam folder, so each one compiles by itself.
    const cls = await ghApi(`${R}/git/blobs`, { method: "POST", body: JSON.stringify({ content: COURSE_CLS, encoding: "utf-8" }) });
    entries.push({ path: `${dir}/course.cls`, mode: "100644", type: "blob", sha: cls.sha });
    const gen = new RegExp(`^${slug.replace(/[.]/g, "\\.")}(-[A-F])?(-key|-guide)?\\.tex$`);
    all.forEach(t => {
      if (t.type !== "blob" || !t.path.startsWith(dir + "/")) return;
      const name = t.path.slice(dir.length + 1);
      if (!name.includes("/") && gen.test(name) && !made.has(t.path)) entries.push({ path: t.path, mode: "100644", type: "blob", sha: null });
    });
    const page = await ghApi(`${R}/git/blobs`, { method: "POST", body: JSON.stringify({ content: examJSON(), encoding: "utf-8" }) });
    entries.push({ path, mode: "100644", type: "blob", sha: page.sha });
    for (const f of texs) {
      const b = await ghApi(`${R}/git/blobs`, { method: "POST", body: JSON.stringify({ content: f.text, encoding: "utf-8" }) });
      entries.push({ path: `${dir}/${f.name}`, mode: "100644", type: "blob", sha: b.sha });
    }
    const tree = await ghApi(`${R}/git/trees`, { method: "POST", body: JSON.stringify({ base_tree: baseTree, tree: entries }) });
    const commit = await ghApi(`${R}/git/commits`, { method: "POST", body: JSON.stringify({ message, tree: tree.sha, parents: [head] }) });
    try { await ghApi(`${R}/git/refs/heads/${encodeURIComponent(gh.branch)}`, { method: "PATCH", body: JSON.stringify({ sha: commit.sha }) }); }
    catch (e) { if (e.status === 422) throw new GhError(0, `Something else was saved ${GH_TO} at the same moment. Press Save again.`); throw e; }

    gh.path = path; gh.last = path; gh.sha = page.sha; gh.copyFrom = ""; fileName = ""; unsaved = false;
    pending.clear(); objectURLs.clear();
    render();
    const written = entries.filter(x => x.sha).map(x => x.path.slice(dir.length + 1)), removed = entries.filter(x => !x.sha).map(x => x.path.slice(dir.length + 1));
    m.innerHTML = `<h2>Saved</h2>
      <p><code>${esc(dir)}</code> is saved ${GH_ON}${GH_W === "GitHub" ? " in one commit" : ""}:</p>
      <ul class="ps-files">${written.map(f => `<li>${esc(f)}</li>`).join("")}${removed.map(f => `<li><s>${esc(f)}</s> removed</li>`).join("")}</ul>

      <div class="row"><button type="button" class="primary" id="ps-done">Done</button></div>`;
    $("#ps-done", m).onclick = closeModal; $("#ps-done", m).focus();
  } catch (e) {
    ok.disabled = false; ok.textContent = `Save ${GH_TO}`;
    if (e.status === 409) {
      err.className = ""; err.innerHTML = notice(`<b>This exam changed ${GH_ON} since you opened it.</b> <a href="#" id="ps-over">Replace GitHub's version with yours</a>, or cancel and open it again to see the other changes. Undo brings yours back.`);
      $("#ps-over", m).onclick = ev => { ev.preventDefault(); doSave(m, path, message, true); };
    } else err.textContent = e.message;
  }
}

// ── Files on this computer ───────────────────────────────────────────
const fileInput = $("#file");
function saveLocal() { download(`${examSlug()}.exam.json`, examJSON()); if (!gh.path) { unsaved = false; updateStatus(); } }
function readFile(f) {
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(String(r.result)); } catch (_) { return toast(`${f.name} isn't an exam file.`); }
    if (!data || !/^exam-builder\//.test(data.format || "")) return toast(`${f.name} wasn't made with the Exam Builder.`);
    if (unsaved) undoStack.push(JSON.stringify(model));
    model = normalize(data); ui.sel = null;
    if (gh.path) gh.last = gh.path;
    gh.path = ""; gh.sha = null; gh.copyFrom = ""; fileName = f.name; unsaved = false; pending.clear();
    while (topModal()) closeModal();
    leaveHome(); render(); toast(`Opened ${f.name}. Save asks where it goes ${GH_ON}.`);
  };
  r.readAsText(f);
}
fileInput.addEventListener("change", () => { if (fileInput.files[0]) readFile(fileInput.files[0]); fileInput.value = ""; });
document.addEventListener("dragover", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
document.addEventListener("drop", e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f && /\.json$/i.test(f.name)) { e.preventDefault(); readFile(f); } });

window.addEventListener("beforeunload", e => { if (unsaved) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("load", () => render());   // KaTeX arrives after the first draw

// The sidebar starts under the toolbar, whatever its height.
const setTb = () => {   // what sticks under the bar starts under the bar and the path strip
  const tb = $(".tb").offsetHeight, pb = $("#pathbar") ? $("#pathbar").offsetHeight : 0;
  document.documentElement.style.setProperty("--tbh", `${tb + pb}px`);
};
addEventListener("resize", setTb);
try { document.execCommand("defaultParagraphSeparator", false, "div"); } catch (_) {}
if (!(window.Lectern && window.Lectern.hosting)) ghLoad();   // inside Lectern, Lectern connects it
render();
setTb();

// ═════════════════════════════════════════════════════════════════════
// Start screen, in the same design as the Course Page Builder's: the
// exams in the repo as cards, plus New exam. Shown when the builder opens
// and from the Home button; opening an exam switches to the editor.
// ═════════════════════════════════════════════════════════════════════
const HICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
};
let view = "editor", homeSeq = 0, ghEditing = false;
const homeEl = $("#home");
const fmtDay = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("en-CA", { month: "short", day: "numeric", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" }); };

function showHome() {
  view = "home"; closePops();
  $(".tb").hidden = true; $("#ctx").hidden = true; stage.hidden = true; homeEl.hidden = false;
  window.scrollTo(0, 0);
  drawHome();
}
function leaveHome() {
  if (view !== "home") return;
  view = "editor";
  homeEl.hidden = true; $(".tb").hidden = false; $("#ctx").hidden = false; stage.hidden = false;
  setTb();
  if (ui.zoomFit) setZoom(fitZoom(), true);
}

// What an exam holds, for its card.
function examStats(e) {
  const qs = e.items.filter(isQ);
  const marks = qs.reduce((s, q) => s + nodePoints(q.variants[0]), 0);
  return { questions: qs.length, marks, versions: e.settings.versions };
}
// When the exam was last saved: the date of the last commit that touched it.
async function savedAt(path) {
  const c = await ghApi(`/repos/${gh.repo}/commits?path=${encodeURIComponent(path)}&sha=${encodeURIComponent(gh.branch)}&per_page=1`);
  return c && c[0] ? c[0].commit.committer.date : "";
}

// The connection, or the form to make one.
function drawSource() {
  const box = $("#h-src");
  if (ghReady() && !ghEditing) {
    box.innerHTML = `<div class="src-bar">${GH_SVG}<div><b><code>${esc(gh.repo)}</code></b><span>Branch <code>${esc(gh.branch)}</code> · each exam lives in <code>course/term/exam/</code></span></div><button type="button" class="home-btn" id="h-ghchange">Change</button></div>`;
    $("#h-ghchange").onclick = () => { ghEditing = true; drawSource(); };
    return;
  }
  const remembered = (() => { try { return !!localStorage.getItem(GH_KEY); } catch (_) { return false; } })();
  box.innerHTML = `<div class="src-bar" style="margin-bottom:14px">${GH_SVG}<div><b>Connect your exams repository</b><span>A private GitHub repository with a folder per course, term and exam, like <code>csc258/f26/midterm</code>.</span></div></div>
    <div class="src-form">
    <div class="form">
      <div class="two">
        <label>Repository<input type="text" id="h-r" value="${esc(gh.repo)}" placeholder="owner/exams" spellcheck="false" autocomplete="off"></label>
        <label>Branch<input type="text" id="h-b" value="${esc(gh.branch || "main")}" spellcheck="false" autocomplete="off"></label>
      </div>
      <label>Personal access token<input type="password" id="h-t" value="${esc(gh.token)}" placeholder="github_pat_…" spellcheck="false" autocomplete="off"></label>
    </div>
    <p class="err" id="h-err"></p>
    <div class="gh-actions"><label class="check"><input type="checkbox" id="h-rem"${remembered ? " checked" : ""}> Remember on this computer</label><span class="spacer"></span>${gh.token ? '<button type="button" class="home-btn" id="h-forget">Disconnect</button>' : ""}${ghReady() ? '<button type="button" class="home-btn" id="h-keep">Cancel</button>' : ""}<button type="button" class="home-btn primary" id="h-go">Connect</button></div>
    <p class="ip-help">The repo holds exams and solutions, so only tick Remember on your own computer.</p>
  </div>`;
  const keep = $("#h-keep"); if (keep) keep.onclick = () => { ghEditing = false; drawSource(); };
  const forget = $("#h-forget");
  if (forget) forget.onclick = () => {
    gh.token = ""; try { localStorage.removeItem(GH_KEY); sessionStorage.removeItem(GH_KEY); } catch (_) {}
    ghEditing = false; toast("Disconnected. The token was removed from this computer."); drawHome();
  };
  box.querySelectorAll(".src-form input").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#h-go").click(); } }));
  $("#h-go").onclick = async () => {
    const go = $("#h-go"), err = $("#h-err");
    const repo = parseRepo($("#h-r").value), branch = $("#h-b").value.trim() || "main", token = $("#h-t").value.trim();
    if (!repo) { err.textContent = "Enter the repository as owner/repo."; return; }
    if (!token) { err.textContent = "Paste a personal access token."; return; }
    const prev = { ...gh };
    Object.assign(gh, { repo, branch, token });
    go.disabled = true; go.textContent = "Checking…"; err.textContent = "";
    try {
      const info = await ghApi(`/repos/${repo}`);
      await ghApi(`/repos/${repo}/branches/${encodeURIComponent(branch)}`);
      if (prev.repo !== repo || prev.branch !== branch) { gh.path = ""; gh.sha = null; updateStatus(); }
      ghSave($("#h-rem").checked);
      ghEditing = false; await drawHome();
      if (info && info.private === false) $("#h-src").insertAdjacentHTML("beforeend", notice(`<b>${esc(repo)} is public.</b> Anyone can read exams saved there. Use a private repo for exams.`));
    } catch (e) { Object.assign(gh, prev); err.textContent = e.message; go.disabled = false; go.textContent = "Connect"; }
  };
  (gh.repo ? $("#h-t") : $("#h-r")).focus();
}

async function drawHome() {
  const seq = ++homeSeq;
  const open = gh.path ? gh.path.replace(/\/exam\.json$/, "") : fileName;
  homeEl.innerHTML = `<div class="home-in">
    <p class="home-kicker">Exam Builder</p>
    <h1>Your exams</h1>
    <p class="home-lede">Write questions straight onto the page, add solutions and rubric comments, then save the student copy, answer key and marking guide as LaTeX.</p>
    <div class="src-box"><div id="h-src"></div></div>${open ? `
    <div class="home-continue"><span>${HICON.file.replace("<svg", '<svg width="18" height="18"')}</span><div><b>Continue editing</b><br><code>${esc(open)}</code>${unsaved ? ` <span class="st-pill" style="margin-left: 6px;">${svg("warn")}${gh.path ? `Not saved ${GH_TO}` : "Unsaved"}</span>` : ""}</div><span class="spacer"></span><button type="button" class="home-btn" id="h-cont">Back to the editor</button></div>` : ""}
    <div class="home-sec"><h2>Exams</h2><span id="h-meta"><button type="button" class="home-link" id="h-file">Open a file from this computer</button></span></div>
    <div id="h-list"></div>
  </div>`;
  const cont = $("#h-cont"); if (cont) cont.onclick = () => { leaveHome(); render(); };
  $("#h-file").onclick = () => fileInput.click();
  drawSource();
  const list = $("#h-list");
  const newCard = `<button type="button" class="pcard new" id="h-new">${HICON.plus}<span>New exam</span><small>Blank, or a copy of an earlier one</small></button>`;
  const wire = () => { const n = $("#h-new"); if (n) n.onclick = () => repoDialog("open", true); };
  if (!ghReady()) { list.innerHTML = `<p class="home-hint">Connect your exams repository above to see its exams.</p>`; return; }
  list.innerHTML = `<div class="home-grid">${'<div class="pcard ghost"><div class="pcard-strip">&nbsp;</div><div style="padding-top: 22px;"><div class="ghost-bar" style="width: 45%; height: 22px;"></div><div class="ghost-bar" style="width: 70%;"></div><div class="ghost-bar" style="width: 55%;"></div></div></div>'.repeat(3)}</div>`;
  let C;
  try { C = await listExams(); }
  catch (e) { if (seq === homeSeq) list.innerHTML = notice(`<b>Couldn't read ${esc(gh.repo)}.</b> ${esc(e.message)}`); return; }
  const exams = [];
  Object.entries(C).forEach(([c, ts]) => Object.entries(ts).forEach(([t, es]) => Object.entries(es).forEach(([e, has]) => { if (has) exams.push({ c, t, e, path: `${c}/${t}/${e}/${EXAM_FILE}` }); })));
  exams.sort((a, b) => termOrder(a.t, b.t) || a.c.localeCompare(b.c) || a.e.localeCompare(b.e));
  const info = await Promise.all(exams.slice(0, 30).map(async x => {
    const [ex, sv] = await Promise.allSettled([fetchExam(x.path), savedAt(x.path)]);
    return { ...x, exam: ex.status === "fulfilled" ? ex.value.exam : null, sha: ex.status === "fulfilled" ? ex.value.sha : null, saved: sv.status === "fulfilled" ? sv.value : "" };
  }));
  if (seq !== homeSeq || view !== "home") return;
  $("#h-meta").innerHTML = `${exams.length} exam${exams.length === 1 ? "" : "s"} in ${esc(gh.repo)} · <button type="button" class="home-link" id="h-file">Open a file</button>`;
  $("#h-file").onclick = () => fileInput.click();
  list.innerHTML = `<div class="home-grid">${info.map((x, k) => {
    const st = x.exam ? examStats(x.exam) : null, S = x.exam ? x.exam.settings : {};
    const title = S.title || x.e;
    const sub = x.exam ? [S.courseCode, S.term].filter(Boolean).join(" · ") || `${x.c} ${x.t}` : "Couldn't be read by the builder";
    return `<div class="pcard" role="button" tabindex="0" data-k="${k}" aria-label="Open ${esc(x.c)} ${esc(x.t)} ${esc(x.e)}">
      <div class="pcard-strip"><span>${esc(x.c)}/${esc(x.t)}/${esc(x.e)}</span>${S.date ? `<span class="cur">${esc(S.date)}</span>` : ""}</div>
      <div class="pcard-body">
        <h3 class="pcard-title">${esc(title)}</h3>
        <p class="pcard-sub">${esc(sub)}</p>
        ${st ? `<div class="pcard-stats"><span>${st.questions} question${st.questions === 1 ? "" : "s"}</span><span>${fmtPts(st.marks)}</span>${st.versions > 1 ? `<span>${st.versions} versions</span>` : ""}</div>` : ""}
      </div>
      <div class="pcard-foot"><span>${x.saved ? `Saved ${esc(fmtDay(x.saved))}` : ""}</span><span>${S.duration ? esc(S.duration) : ""}</span></div>
    </div>`;
  }).join("")}${newCard}</div>`;
  wire();
  list.querySelectorAll(".pcard[data-k]").forEach(el => {
    const go = () => openFromHome(info[Number(el.dataset.k)]);
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

// Open an exam straight from its card (already fetched for the card).
function openFromHome(x) {
  if (!x.exam) return toast(`${x.path} wasn't made with the Exam Builder, so it can't be opened.`);
  if (unsaved) undoStack.push(JSON.stringify(model));
  model = x.exam; ui.sel = null; ui.path = ""; ui.version = 0;
  gh.path = x.path; gh.last = x.path; gh.sha = x.sha; gh.copyFrom = ""; fileName = ""; unsaved = false; pending.clear();
  leaveHome(); render(); toast(`Opened ${x.path.replace(/\/exam\.json$/, "")}`);
}
$("#home-btn").addEventListener("click", showHome);
// ═════════════════════════════════════════════════════════════════════
// The path strip under the top bar (the same in all three builders):
// Home › the open file's folder › the builder's own path (the page's
// .crumbs, or the view it's on). Inside Lectern, Lectern draws its own.
// ═════════════════════════════════════════════════════════════════════
if (!(window.Lectern && window.Lectern.hosting)) (() => {
  const nav = $("#pathbar"); if (!nav) return;
  let raf = 0, steps = [];
  function drawPath() {
    const tb = $(".tb"), home = !$("#home").hidden;
    document.documentElement.style.setProperty("--tb0", `${tb && !tb.hidden ? tb.offsetHeight : 0}px`);
    steps = [{ label: "Home", go: home ? null : () => $("#home-btn").click() }];
    if (!home) {
      steps.push({ label: gh.path ? gh.path.split("/").slice(0, -1).join(" / ") : fileName || "Untitled" });
      const cr = [...document.querySelectorAll("#stage .crumbs")].find(n => !n.closest("[hidden]"));
      const seg = document.querySelector("#tb-view .seg button[aria-pressed='true']");
      if (cr) [...cr.children].forEach(n => { if (n.matches("button")) steps.push({ label: n.textContent.trim(), go: () => n.click() }); else if (n.matches(".cur")) steps.push({ label: n.textContent.trim() }); });
      else if (seg) steps.push({ label: seg.textContent.trim() });
    }
    nav.classList.toggle("on-home", home);
    nav.innerHTML = steps.map((s, k) => {
      const last = k === steps.length - 1, t = esc(s.label);
      return (!last && s.go ? `<button type="button" class="pb-s" data-k="${k}" title="${t}">${t}</button>` : `<span class="pb-s${last ? " cur" : ""}"${last ? ' aria-current="page"' : ""} title="${t}">${t}</span>`) + (last ? "" : '<span class="pb-sep" aria-hidden="true">›</span>');
    }).join("");
    nav.scrollLeft = nav.scrollWidth;   // on a narrow screen, the end of the path is what shows
  }
  nav.addEventListener("click", e => { const b = e.target.closest("button[data-k]"); if (b && steps[Number(b.dataset.k)].go) steps[Number(b.dataset.k)].go(); });
  new MutationObserver(recs => {
    if (recs.every(r => nav.contains(r.target))) return;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(drawPath);
  }).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["hidden", "aria-pressed"] });
  addEventListener("resize", drawPath);
  drawPath();
})();

// ═════════════════════════════════════════════════════════════════════
// Lectern: when Lectern hosts this builder, it hands over the connection
// (a GitHub sign-in or a local folder) and opens files itself, so the
// builder's own start screen and saved token aren't used. Opened on its
// own, the builder starts exactly as before.
// ═════════════════════════════════════════════════════════════════════
const lectern = window.Lectern && window.Lectern.hosting ? window.Lectern : null;
if (lectern) {
  const termName = t => { const m = /^([wsf])(\d{2})$/i.exec(t); return m ? `${{ w: "Winter", s: "Summer", f: "Fall" }[m[1].toLowerCase()]} 20${m[2]}` : t; };
  lectern.register("exams", {
    connect(c) {
      const fold = c.token === "folder"; GH_W = fold ? "your folder" : "GitHub"; GH_ON = fold ? "in your folder" : "on GitHub"; GH_TO = fold ? "to your folder" : "to GitHub"; if (c.mode === "github") Object.assign(gh, { repo: c.repo, branch: c.branch || "main", token: c.token }); },
    // Open <course>/<term>/<exam>/exam.json; a new one starts blank (named and dated) or from a copy of another exam.
    async open(folder, has, copyFrom, title, extra = {}) {
      const path = `${folder}/${EXAM_FILE}`, [c, t] = folder.split("/");
      let exam, sha = null;
      if (has) ({ exam, sha } = await fetchExam(path));
      else if (copyFrom) exam = (await fetchExam(`${copyFrom}/${EXAM_FILE}`)).exam;
      else { exam = BLANK_EXAM(); Object.assign(exam.settings, { title: title || "", courseCode: c.toUpperCase(), term: termName(t) }); }
      if (!has) {   // made from a gradebook evaluation: a test is an exam, an assignment a handout
        if (extra.layout) { exam.settings.layout = extra.layout; if (extra.layout === "handout") exam.cover.on = false; }
        if (extra.date) exam.settings.date = extra.date;
        if (extra.link) exam.settings.link = extra.link;
      }
      if (unsaved) undoStack.push(JSON.stringify(model));
      model = exam; ui.sel = null; ui.path = ""; ui.version = 0;
      gh.path = path; gh.last = path; gh.sha = sha; gh.copyFrom = has ? "" : copyFrom || ""; fileName = ""; unsaved = !has; pending.clear();
      leaveHome(); render();
    },
    // Lectern's one Save: save to where it is, without the dialog. → { ok } or { conflict } or { error }
    async save(message, overwrite = false) {
      if (!gh.path || !unsaved) return { ok: true };
      const m = document.createElement("div");
      m.innerHTML = `<button id="pl-ok"></button><p id="pl-err"></p>`;
      quietSave = true;
      try { await doSave(m, gh.path, message, overwrite); } finally { quietSave = false; }
      if (!unsaved) return { ok: true };
      if ($("#ps-over", m)) return { conflict: true };
      return { error: $("#pl-err", m).textContent || "Couldn't save." };
    },
    // Which of its pages it's on (student copy, marking guide, settings), and going back there.
    where: () => ({ output: ui.output }),
    goto(l) { if (l.output) { ui.output = l.output; render(); } },
    state: () => ({ path: gh.path, unsaved, title: model.settings.title || "", total: total(0), link: model.settings.link || "", layout: model.settings.layout || "exam" }),
  });
} else {
  showHome();   // the builder opens on the start screen
}
})();
</script>
