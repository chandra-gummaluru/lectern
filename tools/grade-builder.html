    go.disabled = true; go.textContent = "Checking…"; err.textContent = "";
    try {
      const info = await ghApi(`/repos/${repo}`);
      await ghApi(`/repos/${repo}/branches/${encodeURIComponent(branch)}`);
      if (prev.repo !== repo || prev.branch !== branch) { gh.path = ""; gh.sha = null; updateStatus(); }
      ghSave($("#h-rem").checked);
      ghEditing = false; await drawHome();
      if (info && info.private === false) $("#h-src").insertAdjacentHTML("beforeend", notice(`<b>${esc(repo)} is public.</b> Anyone can read grades saved there. Use a private repo for grades.`));
    } catch (e) { Object.assign(gh, prev); err.textContent = e.message; go.disabled = false; go.textContent = "Connect"; }
  };
  (gh.repo ? $("#h-t") : $("#h-r")).focus();
}

async function drawHome() {
  const seq = ++homeSeq;
  const open = gh.path ? gh.path.replace(/\/grades\.json$/, "") : fileName;
  homeEl.innerHTML = `<div class="home-in">
    <p class="home-kicker">Grade Builder</p>
    <h1>Your gradebooks</h1>
    <p class="home-lede">Set up each course's evaluations, weights and what happens when work isn't submitted, upload marks, and see every student's grade as you go.</p>
    <div class="src-box"><div id="h-src"></div></div>${open ? `
    <div class="home-continue"><span>${HICON.file.replace("<svg", '<svg width="18" height="18"')}</span><div><b>Continue editing</b><br><code>${esc(open)}</code>${unsaved ? ` <span class="st-pill" style="margin-left: 6px;">${svg("warn")}${gh.path ? `Not saved ${GH_TO}` : "Unsaved"}</span>` : ""}</div><span class="spacer"></span><button type="button" class="home-btn" id="h-cont">Back to the gradebook</button></div>` : ""}
    <div class="home-sec"><h2>Gradebooks</h2><span id="h-meta"><button type="button" class="home-link" id="h-file">Open a file from this computer</button></span></div>
    <div id="h-list"></div>
  </div>`;
  const cont = $("#h-cont"); if (cont) cont.onclick = () => { leaveHome(); render(); };
  $("#h-file").onclick = () => fileInput.click();
  drawSource();
  const list = $("#h-list");
  const newCard = `<button type="button" class="pcard new" id="h-new">${HICON.plus}<span>New gradebook</span><small>A new term of a course, or a new course</small></button>`;
  const wire = () => { const n = $("#h-new"); if (n) n.onclick = () => repoDialog("open", true); };
  if (!ghReady()) { list.innerHTML = `<p class="home-hint">Connect your grades repository above to see its gradebooks.</p>`; return; }
  list.innerHTML = `<div class="home-grid">${'<div class="pcard ghost"><div class="pcard-strip">&nbsp;</div><div style="padding-top: 22px;"><div class="ghost-bar" style="width: 45%; height: 22px;"></div><div class="ghost-bar" style="width: 70%;"></div><div class="ghost-bar" style="width: 55%;"></div></div></div>'.repeat(3)}</div>`;
  let C;
  try { C = await listBooks(); }
  catch (e) { if (seq === homeSeq) list.innerHTML = notice(`<b>Couldn't read ${esc(gh.repo)}.</b> ${esc(e.message)}`); return; }
  const books = [];
  Object.entries(C).forEach(([c, ts]) => Object.entries(ts).forEach(([t, has]) => { if (has) books.push({ c, t, path: `${c}/${t}/${BOOK_FILE}` }); }));
  books.sort((a, b) => termOrder(a.t, b.t) || a.c.localeCompare(b.c));
  const info = await Promise.all(books.slice(0, 30).map(async x => {
    const [bk, sv] = await Promise.allSettled([fetchBook(x.path), savedAt(x.path)]);
    return { ...x, book: bk.status === "fulfilled" ? bk.value.book : null, sha: bk.status === "fulfilled" ? bk.value.sha : null, saved: sv.status === "fulfilled" ? sv.value : "" };
  }));
  if (seq !== homeSeq || view !== "home") return;
  $("#h-meta").innerHTML = `${books.length} gradebook${books.length === 1 ? "" : "s"} in ${esc(gh.repo)} · <button type="button" class="home-link" id="h-file">Open a file</button>`;
  $("#h-file").onclick = () => fileInput.click();
  // One icon per course (the same in every term), and no two courses on the screen share one.
  const byCourse = new Map(), used = new Set();
  info.forEach(x => { if (byCourse.has(x.c)) return; let k = CARD_ICONS.indexOf(cardIcon(x.c)); for (let n = 0; n < CARD_ICONS.length && used.has(k); n++) k = (k + 1) % CARD_ICONS.length; used.add(k); byCourse.set(x.c, CARD_ICONS[k].svg); });
  const icons = info.map(x => byCourse.get(x.c));
  list.innerHTML = `<div class="home-grid">${info.map((x, k) => {
    const st = x.book ? bookStats(x.book) : null;
    return `<div class="pcard" role="button" tabindex="0" data-k="${k}" aria-label="Open ${esc(x.c)} ${esc(x.t)}">
      <div class="pcard-strip"><span>${esc(x.c)}/${esc(x.t)}</span>${st && st.avg != null ? `<span class="cur">Average ${fmtNum(st.avg)}%</span>` : ""}</div>
      <div class="pcard-body">
        <span class="pcard-ico" aria-hidden="true">${icons[k]}</span>
        <h3 class="pcard-title">${esc((x.book && x.book.course.code) || x.c.toUpperCase())}</h3>
        <p class="pcard-sub">${esc((x.book && x.book.course.term) || termName(x.t))}</p>
      </div>
      <div class="pcard-foot"><span>${x.saved ? `Saved ${esc(fmtDay(x.saved))}` : ""}</span></div>
    </div>`;
  }).join("")}${newCard}</div>`;
  wire();
  list.querySelectorAll(".pcard[data-k]").forEach(el => {
    const go = () => openFromHome(info[Number(el.dataset.k)]);
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

// Open a gradebook straight from its card (already fetched for the card).
function openFromHome(x) {
  if (!x.book) return toast(`${x.path} wasn't made with the Grade Builder, so it can't be opened.`);
  loadBook(x.book, x.path, x.sha); toast(`Opened ${x.path.replace(/\/grades\.json$/, "")}`);
}
$("#home-btn").addEventListener("click", showHome);
// ═════════════════════════════════════════════════════════════════════
// The path strip under the top bar (the same in all three builders):
// Home › the open file's folder › the builder's own path (the page's
// .crumbs, or the view it's on). Inside Lectern, Lectern draws its own.
// ═════════════════════════════════════════════════════════════════════
if (!(window.Lectern && window.Lectern.hosting)) (() => {
  const nav = $("#pathbar"); if (!nav) return;
  let raf = 0, steps = [];
  function drawPath() {
    const tb = $(".tb"), home = !$("#home").hidden;
    document.documentElement.style.setProperty("--tb0", `${tb && !tb.hidden ? tb.offsetHeight : 0}px`);
    steps = [{ label: "Home", go: home ? null : () => $("#home-btn").click() }];
    if (!home) {
      steps.push({ label: gh.path ? gh.path.split("/").slice(0, -1).join(" / ") : fileName || "Untitled" });
      const cr = [...document.querySelectorAll("#stage .crumbs")].find(n => !n.closest("[hidden]"));
      const seg = document.querySelector("#tb-view .seg button[aria-pressed='true']");
      if (cr) [...cr.children].forEach(n => { if (n.matches("button")) steps.push({ label: n.textContent.trim(), go: () => n.click() }); else if (n.matches(".cur")) steps.push({ label: n.textContent.trim() }); });
      else if (seg) steps.push({ label: seg.textContent.trim() });
    }
    nav.classList.toggle("on-home", home);
    nav.innerHTML = steps.map((s, k) => {
      const last = k === steps.length - 1, t = esc(s.label);
      return (!last && s.go ? `<button type="button" class="pb-s" data-k="${k}" title="${t}">${t}</button>` : `<span class="pb-s${last ? " cur" : ""}"${last ? ' aria-current="page"' : ""} title="${t}">${t}</span>`) + (last ? "" : '<span class="pb-sep" aria-hidden="true">›</span>');
    }).join("");
    nav.scrollLeft = nav.scrollWidth;   // on a narrow screen, the end of the path is what shows
  }
  nav.addEventListener("click", e => { const b = e.target.closest("button[data-k]"); if (b && steps[Number(b.dataset.k)].go) steps[Number(b.dataset.k)].go(); });
  new MutationObserver(recs => {
    if (recs.every(r => nav.contains(r.target))) return;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(drawPath);
  }).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["hidden", "aria-pressed"] });
  addEventListener("resize", drawPath);
  drawPath();
})();

// ═════════════════════════════════════════════════════════════════════
// Lectern: when Lectern hosts this builder, it hands over the connection
// (a GitHub sign-in or a local folder) and opens files itself, so the
// builder's own start screen and saved token aren't used. Opened on its
// own, the builder starts exactly as before.
// ═════════════════════════════════════════════════════════════════════
const lectern = window.Lectern && window.Lectern.hosting ? window.Lectern : null;
if (lectern) {
  render();
  if (lectern.myGroups) addEventListener("hashchange", () => { MINE = null; });
  setTb();
  lectern.register("grades", {
    connect(c) {
      const fold = c.token === "folder", srv = c.token === "session"; GH_W = fold ? "your folder" : srv ? "Lectern" : "GitHub"; GH_ON = fold ? "in your folder" : srv ? "in Lectern" : "on GitHub"; GH_TO = fold ? "to your folder" : srv ? "to Lectern" : "to GitHub"; if (c.mode === "github") Object.assign(gh, { repo: c.repo, branch: c.branch || "main", token: c.token }); },
    // Open <course>/<term>/grades.json, or start a new gradebook there.
    async open(folder, has) {
      const path = `${folder}/${BOOK_FILE}`, [c, t] = folder.split("/");
      if (has) { const { book, sha } = await fetchBook(path); loadBook(book, path, sha); }
      else { const b = BLANK_BOOK(); b.course.code = c.toUpperCase(); b.course.term = termName(t); loadBook(b, path, null); }
      if (lectern.myGroups) lectern.myGroups().then(m => { MINE = m; render(); }).catch(() => {});
      if (lectern.sections) lectern.sections().then(x => { SECS = x || []; render(); }).catch(() => {});
    },
    // Lectern's one Save: save to where it is, without the dialog. → { ok } or { conflict } or { error }
    async save(message, overwrite = false) {
      if (!gh.path || !unsaved) return { ok: true };
      const m = document.createElement("div");
      m.innerHTML = `<button id="pl-ok"></button><p id="pl-err"></p>`;
      quietSave = true;
      try { await doSave(m, gh.path, message, overwrite); } finally { quietSave = false; }
      if (!unsaved) return { ok: true };
      if ($("#ps-over", m)) return { conflict: true };
      return { error: $("#pl-err", m).textContent || "Couldn't save." };
    },
    state: () => ({ path: gh.path, unsaved, view: ui.view }),
    // Which part of it Lectern shows: "evals" (Evaluations), "book" (the Gradebook: Grades and Students) or "settings".
    section(part) {
      const T = { evals: ["evals"], book: ["grades"], settings: ["settings"] }[part];
      if (!T) return;
      const same = tabs && tabs.join() === T.join();
      tabs = T;
      if (!T.includes(ui.view) && !(part === "book" && ui.view === "students" && ui.student)) { ui.view = T[0]; ui.evalEd = ui.groupEd = ui.student = ui.stAcc = ""; ui.cell = null; }
      else if (same) return;
      render();
    },
    // Where it is (a view, an evaluation's or student's page…), and going back there: Lectern's Back and Forward.
    where: () => ({ focus: ui.focus, view: ui.view, evalEd: ui.evalEd || "", groupEd: ui.groupEd || "", student: ui.student || "", stAcc: ui.stAcc || "", stFrom: ui.stFrom || "" }),
    goto(l) { Object.assign(ui, l); ui.cell = null; render(); },
    // links: { evaluation id: { folder, total, layout } }. A linked document's total is the evaluation's out of.
    setLinks(links) {
      docLinks = new Map(Object.entries(links || {}).filter(([id]) => evalById(id)));
      const moved = [...docLinks].filter(([id, d]) => num(d.total) > 0 && num(evalById(id).total) !== num(d.total));
      if (moved.length) {
        pushUndo();
        moved.forEach(([id, d]) => { evalById(id).total = num(d.total); });
        unsaved = true;
        toast(moved.length === 1 ? `${evalById(moved[0][0]).name} is now out of ${fmtNum(num(moved[0][1].total))}, from its ${moved[0][1].layout === "handout" ? "handout" : "exam"}.` : `${moved.length} evaluations' totals now come from their exams and handouts.`);
      }
      render();
    },
    book: () => { const b = JSON.parse(JSON.stringify(model)); syncAccom(b); return b; },
    // Open on one of its pages (e.g. "evals", from the course page's Edit in Grades).
    view(v) { if (["evals", "students", "stats", "grades", "settings"].includes(v)) { ui.view = v; ui.evalEd = ui.groupEd = ui.student = ""; ui.cell = null; render(); } },
  });
} else {
  ghLoad();
  render();
  setTb();
  showHome();   // the builder opens on the start screen
}
})();
</script>
