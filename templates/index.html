<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lectern — {{ institution }}</title>
    <meta name="theme-color" content="#333333">
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/static/css/splash.css">
    <link rel="stylesheet" href="/static/css/shell.css">
    <script src="/static/js/boot.js"></script>
</head>
<body>
    <!-- ── Splash: one family with Beamer+ and Test Mail (serif wordmark, institution, a live preview,
         an outline watermark), with its own look: a centred title over a wide preview of a week. ── -->
    <div class="splash" id="splash">
        <div class="sp-watermark" aria-hidden="true">
            <svg viewBox="0 0 120 120">
                <g transform="translate(60, 64) rotate(-8) scale(1.05)">
                    <polygon points="-38,-30 38,-42 40,-32 -36,-20"/>
                    <polygon points="-5,-25 5,-27 5,34 -5,34"/>
                    <polygon points="-24,34 24,34 28,42 -28,42"/>
                </g>
            </svg>
        </div>

        <main class="sp-screen">
            <header class="sp-copy">
                <h1 class="sp-title">Lectern</h1>
                <p class="sp-inst">{{ institution }}</p>
                <p class="sp-tag">Every course, from the first lecture to the final mark.</p>

                <!-- Sign in. The other steps (a two-factor code, a forgotten password, an invitation) are drawn
                     in #sp-panel by auth.js. The password goes only to this server, over HTTPS. -->
                <form class="sp-form" id="sp-form" action="#" method="post" novalidate>
                    <label class="sp-field"><span>Email</span>
                        <input type="email" id="sp-email" name="email" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
                    <label class="sp-field"><span>Password</span>
                        <span class="sp-pw"><input type="password" id="sp-pw" name="password" autocomplete="current-password" required><button type="button" class="sp-show" data-show="sp-pw" aria-label="Show password">Show</button></span></label>
                    <button type="submit" class="sp-btn sp-btn--primary" id="sp-go">Sign in</button>
                    <button type="button" class="sp-link" id="sp-forgot">Forgot your password?</button>
                </form>
                <div class="sp-form" id="sp-panel" hidden></div>
                <div class="sp-under">
                    {% if learn_more %}
                    <a class="sp-more" href="{{ learn_more }}" target="_blank" rel="noopener">Learn more</a>{% endif %}
                </div>
                <p class="sp-hint" id="splash-status" role="status" aria-live="polite"></p>
            </header>

            <!-- The three parts of a course, in miniature, each lifting in turn. -->
            <figure class="sp-preview" aria-hidden="true">
                <div class="mk3">
                    <div class="mkc c1">
                        <div class="mkc-h">Course Page</div>
                        <div class="mkc-b">
                            <div class="m-wk"><span><b>Week 3</b><i class="ln" style="width:70%"></i></span><em class="m-pill">Lab 2</em><span class="m-hrs"><i></i><i></i></span></div>
                            <div class="m-wk"><span><b>Week 4</b><i class="ln" style="width:55%"></i></span><em class="m-pill dk">Quiz</em><span class="m-hrs"><i class="h2"></i></span></div>
                            <div class="m-wk"><span><b>Week 5</b><i class="ln" style="width:80%"></i></span><span class="m-hrs"><i></i><i></i></span></div>
                        </div>
                    </div>
                    <div class="mkc c2">
                        <div class="mkc-h">Gradebook</div>
                        <div class="mkc-b m-gb">
                            <div class="m-avg"><b>78%</b><span>/ 80%</span></div>
                            <div class="m-hist"><i style="height:18%"></i><i class="lo" style="height:30%"></i><i class="md" style="height:55%"></i><i style="height:80%"></i><i style="height:100%"></i><i style="height:62%"></i><i style="height:34%"></i></div>
                            <div class="m-rows"><span><i class="ln" style="width:60%"></i><b>27</b></span><span><i class="ln" style="width:45%"></i><b>24</b></span></div>
                        </div>
                    </div>
                    <div class="mkc c3">
                        <div class="mkc-h">Exam</div>
                        <div class="mkc-b m-ex">
                            <div class="m-sheet">
                                <div class="m-sh"><b>Midterm</b></div>
                                <div class="m-q"><b>1</b><i class="ln" style="width:72%"></i><em>/4</em></div>
                                <div class="m-sol"><i class="ln" style="width:60%"></i></div>
                                <div class="m-q"><b>2</b><i class="ln" style="width:58%"></i><em>/6</em></div>
                                <div class="m-box"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </figure>
        </main>
    </div>

    <!-- ── The app: one top bar (with the path in it), then a page or a builder ── -->
    <div class="lt-app" id="app" hidden>
        <header class="lt-bar" id="lt-bar" role="toolbar" aria-label="Lectern">
            <button type="button" class="lt-home" id="lt-home" title="Home: all courses" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5"/></svg></button>
            <nav class="lt-path" id="lt-path" aria-label="Where you are"></nav>
            <span class="lt-status" id="lt-status"></span>
            <span class="lt-acct-wrap"><button type="button" class="lt-acct" id="lt-acct" aria-haspopup="menu" aria-expanded="false"></button></span>
        </header>
        <main class="lt-page" id="lt-page"></main>
        <div class="lt-tools" id="lt-tools"></div>
    </div>
    <div id="lt-modal-root"></div>
    <div id="lt-toast-root"></div>

    <script src="/static/js/scope.js"></script>
    <script type="module" src="/static/js/lectern.js"></script>
</body>
</html>
