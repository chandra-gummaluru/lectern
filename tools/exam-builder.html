<script>
(() => {
"use strict";

// ── Helpers ──────────────────────────────────────────────────────────
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 10);
const getP = (obj, path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
function setP(obj, path, val) { const ks = path.split("."); const last = ks.pop(); ks.reduce((o, k) => o[k], obj)[last] = val; }
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const fmtNum = n => String(Math.round(num(n) * 100) / 100);
const fmtPts = n => `${fmtNum(n)} ${num(n) === 1 ? "mark" : "marks"}`;
const signed = n => (num(n) > 0 ? "+" : num(n) < 0 ? "−" : "±") + fmtNum(Math.abs(num(n)));
const LET = i => "ABCDEF"[i] || "?";
const partLetter = j => String.fromCharCode(97 + j);

const ICON = {
  up: '<path d="m6 15 6-6 6 6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  right: '<path d="m9 6 6 6-6 6"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/>',
  cut: '<path d="M3 12h3M9 12h2M14 12h2M19 12h2"/><path d="M6 4v4M18 4v4M6 20v-4M18 20v-4"/>',
  rough: '<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="m8 15 2-3 2 2 4-5"/>',
  page: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  grip: '<circle cx="9" cy="6" r="1.4" fill="currentColor"/><circle cx="15" cy="6" r="1.4" fill="currentColor"/><circle cx="9" cy="12" r="1.4" fill="currentColor"/><circle cx="15" cy="12" r="1.4" fill="currentColor"/><circle cx="9" cy="18" r="1.4" fill="currentColor"/><circle cx="15" cy="18" r="1.4" fill="currentColor"/>',
  warn: '<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.5h.01"/>',
};
const svg = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

// ── The exam model (saved as exam.json) ──────────────────────────────
// Multiple select is multiple choice with "Multiple answers" ticked (type "ms").
const TYPES = { written: "Written answer", mc: "Multiple choice", tf: "True or false" };
const typeKey = t => (t === "ms" ? "mc" : t);
const LAYOUTS = { stack: "Stacked", row: "In a row", cols2: "2 columns", cols3: "3 columns" };

// Answer components: answer pieces placed in a question's text as [[id]].
const COMPS = {
  blank: { label: "Blank line", make: () => ({ kind: "blank", len: "3cm", ans: "" }) },
  box: { label: "Box", make: () => ({ kind: "box", w: "4cm", h: "1.2cm", ans: "" }) },
  num: { label: "Number box", make: () => ({ kind: "num", w: "2.5cm", ans: "" }) },
  frac: { label: "Fraction", make: () => ({ kind: "frac", w: "1.5cm", num: "", den: "" }) },
  cells: { label: "Row of cells", make: () => ({ kind: "cells", n: 4, cell: "7mm", ans: "" }) },
};
const TOKEN = /\[\[(\w+)\]\]/g;

// A node is one question or sub-question: text, answers, marks, solution,
// rubric and space, plus its own sub-questions in parts (two levels deep).
const newNode = (type = "written") => ({
  id: uid(), type, body: "", points: type === "written" ? 2 : 1, solution: "", rubric: [],
  space: { mode: type === "written" ? "height" : "none", h: "4cm" },
  options: type === "tf" ? [] : [{ id: uid(), text: "", correct: type === "mc" }, { id: uid(), text: "", correct: false }, { id: uid(), text: "", correct: false }, { id: uid(), text: "", correct: false }],
  layout: "stack", answer: "true", comps: {}, parts: [],
});
const newQuestion = type => ({ kind: "question", id: uid(), marking: "full", newPage: false, tags: [], notes: "", variants: [newNode(type)] });
const DEFAULT_INSTRUCTIONS = `Do not begin until instructed to do so.
Read each question carefully.
Show your work where instructed; partial credit requires visible reasoning.`;
const BLANK_EXAM = () => ({
  format: "exam-builder/2",
  settings: { title: "", courseCode: "", courseName: "", term: "", instructors: "", date: "", duration: "", university: "University of Toronto", department: "Faculty of Arts and Science",
    target: 0, versions: 1, topSpace: 0, pageNumbers: true, macros: "", preamble: "",
    // Exam: a cover page and answer spaces. Handout (an assignment): instructions and no answer spaces.
    layout: "exam", instructions: "", link: "" },   // link: the gradebook evaluation this is for (its id)
  cover: {
    on: true, pointsTable: true, scoreRow: true, instructionsOn: true, goodLuck: false, aids: "None", instructions: DEFAULT_INSTRUCTIONS,
    fields: [
      { id: uid(), label: "Last Name", type: "boxes", count: 16, beside: false },
      { id: uid(), label: "First Name", type: "boxes", count: 16, beside: false },
      { id: uid(), label: "UTORId (e.g. gummalur)", type: "boxes", count: 8, beside: false },
      { id: uid(), label: "Student #", type: "boxes", count: 10, beside: true },
    ],
  },

    "\\documentclass{course}",
    "",
    set("University", S.university), set("Department", S.department), set("CourseCode", S.courseCode), set("CourseName", S.courseName),
    set("Term", S.term), set("Instructors", S.instructors), set("DocTitle", S.title || "Exam"),
  ];
  if (S.date) L.push(set("ExamDate", S.date));
  if (S.duration) L.push(set("Duration", S.duration));
  if (N > 1) L.push(set("Version", LET(vi)));
  if (C.on) {
    if (C.aids.trim()) L.push(`\\renewcommand{\\AidsAllowedList}{%\n${itemize(C.aids)}\n}`, "\\showaidsallowedtrue");
    if (C.instructionsOn !== false && C.instructions.trim()) L.push(`\\renewcommand{\\CoverInstructionsList}{%\n${itemize(C.instructions)}\n}`, "\\showcoverinstructionstrue");
    if (C.fields.length) L.push("\\renewcommand{\\StudentInfo}{%", ...studentInfoTex(C.fields), "}", "\\showstudentinfotrue", `\\AtBeginDocument{\\setlength{\\StudentBoxSize}{${boxSizeTex(C.fields)}}}`);
    if (C.pointsTable && model.items.some(isQ)) L.push("\\showpointstabletrue", ...(C.scoreRow === false ? ["\\showscorerowfalse"] : []));
    if (C.goodLuck) L.push("\\showgoodlucktrue");
  }
  if (num(S.topSpace) > 0) L.push(`\\SetScanMargin{${fmtNum(S.topSpace)}cm}`);
  if (!S.pageNumbers) L.push("\\showpagenumbersfalse");
  if (S.macros.trim()) L.push("", "% Macros (also used by the Exam Builder's preview)", S.macros.trim());
  if (S.preamble.trim()) L.push("", "% Extra preamble", S.preamble.trim());
  L.push("", "\\begin{document}");
  if (C.on) L.push("\\MakeCoverPage");
  else if (handout()) {   // a handout's own heading: title, course and term, due date, then its instructions
    L.push("\\begin{center}", `{\\LARGE\\bfseries ${texEsc(S.title || "Assignment")}\\par}\\vspace{2mm}`,
      `{${texEsc([S.courseCode, S.term].filter(x => String(x || "").trim()).join(" \u00b7 "))}\\par}`, ...(S.date ? [`{Due ${texEsc(S.date)}\\par}`] : []), "\\end{center}", "\\vspace{4mm}");
    if (String(S.instructions || "").trim()) L.push("\\noindent\\textbf{Instructions}", itemize(S.instructions), "\\vspace{4mm}");
  }
  const anyQ = model.items.some(isQ);   // an empty list of questions doesn't compile
  if (anyQ) L.push("\\begin{questions}", "");
  const nums = numbering();
  model.items.forEach((it, i) => {
    if (isQ(it)) {
      const v = variantFor(it, vi);
      if (!v) { L.push(`% Question ${nums[i]} has no variant ${LET(vi)}.`, "\\question \\textbf{Missing: this question has no variant for this version.}", ""); return; }
      L.push(`% ── Question ${nums[i]}${it.variants.length > 1 ? ` (variant ${LET(vi)})` : ""} ──`, ...(it.newPage ? ["\\clearpage"] : []), ...nodeTex(v, 0, it.marking), "");
    } else if (it.kind === "break") L.push("\\clearpage", "");
    else if (it.kind === "rough") L.push("\\RoughWorkPage", "");
    else L.push("% Content page", "\\clearpage", ...(it.title.trim() ? [`\\section*{${texEsc(it.title.trim())}}`] : []), it.body.trim(), "\\clearpage", "");
  });
  if (anyQ) L.push("\\end{questions}");
  L.push(...(handout() ? [] : ["\\EndOfExam"]), "\\end{document}", "");
  return L.join("\n");
}

// ── The course class (course.cls v2.5), written into every exam folder on save ──
const COURSE_CLS = "% ============================================================================\n%  course.cls  (v2.1)\n%  Document class for handouts, assignments, quizzes and exams.\n%\n%  Class options:\n%    solutions  -- print solutions (answer key)\n%    marking    -- print solutions and rubric comments (marking guide)\n%  e.g. \\documentclass[solutions]{course}. The Exam Builder's -key and -guide\n%  files pass these options, so the student copy, answer key and marking\n%  guide all compile from one source.\n%\n%  Changes from v2.0:\n%    * solution: hidden text is now really hidden when solutions are off\n%      (v2.0 still printed the answer, just without the frame).\n%    * solutions / marking class options, and a marking environment.\n%    * \\StudentInfo: the cover's student-info rows can be redefined.\n%    * \\DigitBubbles, \\answerspace, \\answerbox, \\correctchoice, \\TrueFalse.\n%    * \\RoughWorkPage and \\EndOfExam (were in each exam's .tex).\n%    * Compact points table by default (was overridden in each exam).\n%    * \\SetScanMargin for scanned exams; \\showpagenumbers switch;\n%      \\ExamDate and \\Version metadata.\n%    * Answer key / marking guide titles and hiding student info on them\n%      happen here, not in each exam's .tex.\n%  Changes in v2.2:\n%    * subparts / \\subpart[n] for (i), (ii) inside a part; \\partpoints{n}.\n%    * Answer components that show their answer only in the key:\n%      \\ansblank, \\ansbox, \\ansnum, \\ansfrac, \\anscells.\n%    * \\correctcheckbox for multiple-select questions; choice layouts.\n%  Changes in v2.3:\n%    * \\showscorerowfalse leaves the blank Score row out of the points table.\n%  Changes in v2.4:\n%    * Student boxes are all one size (\\StudentBoxSize, a sixteenth of the\n%      text width by default) instead of stretching to fill the line.\n%  Changes in v2.5:\n%    * Two fields side by side are one box apart, so their boxes line up\n%      with the rows above and below.\n% ============================================================================\n\n\\NeedsTeXFormat{LaTeX2e}\n\\ProvidesClass{course}[2026/10/16 v2.5 course handout/assignment/exam/quiz class]\n\n% ---- switches (defined first so the class options can set them) ------------\n\\newif\\ifshowstudentinfo\n\\newif\\ifshowpointstable\n\\newif\\ifshowsolutions\n\\newif\\ifshowmarking\n\\newif\\ifshowaidsallowed\n\\newif\\ifshowcoverinstructions\n\\newif\\ifshowgoodluck\n\\newif\\ifshowscorerow\n\\newif\\ifshowpagenumbers\n\\showpagenumberstrue\n\\showscorerowtrue\n\n\\DeclareOption{solutions}{\\showsolutionstrue}\n\\DeclareOption{marking}{\\showsolutionstrue\\showmarkingtrue}\n\\DeclareOption*{\\PassOptionsToClass{\\CurrentOption}{article}}\n\\ProcessOptions\\relax\n\\LoadClass[11pt]{article}\n\n% ---- required packages ------------------------------------------------------\n\\RequirePackage[margin=1in, top=1.75in, headsep=3mm, footskip=0.5in]{geometry}\n\\RequirePackage{fancyhdr}\n\\setlength{\\headheight}{15pt}\n\\RequirePackage{lastpage}\n\\RequirePackage{tikz}\n\\usetikzlibrary{positioning}\n\\RequirePackage{enumitem}\n\\RequirePackage{titlesec}\n\\RequirePackage{xcolor}\n\\RequirePackage{amsmath, amssymb}\n\\RequirePackage{etoolbox}\n\\RequirePackage{ifthen}\n\\RequirePackage{environ}\n\\RequirePackage{comment}\n\\RequirePackage{totcount}\n\\RequirePackage{array}\n\\RequirePackage{booktabs}\n\\RequirePackage{longtable}\n\\RequirePackage{varwidth}\n\\RequirePackage{graphicx}\n\n% ============================================================================\n%  COURSE INFO -- defaults. Override in your .tex with \\renewcommand{...}{...}\n% ============================================================================\n\\newcommand{\\University}{University Name}\n\\newcommand{\\Department}{Department Name}\n\\newcommand{\\CourseCode}{CSC000}\n\\newcommand{\\CourseName}{Course Name}\n\\newcommand{\\Term}{Term Year}\n\\newcommand{\\Instructors}{Instructor Name}\n\\newcommand{\\DocTitle}{Document Title}\n\n% Optional metadata rows -- leave empty (the default) to hide them.\n\\newcommand{\\ExamDate}{}\n\\newcommand{\\Duration}{}\n\\newcommand{\\Due}{}\n\\newcommand{\\Weight}{}\n\\newcommand{\\Version}{}\n\n% Optional itemized lists for the cover page, e.g.\n%   \\renewcommand{\\AidsAllowedList}{\\item Non-programmable calculator}\n\\newcommand{\\AidsAllowedList}{\\item None}\n\\newcommand{\\CoverInstructionsList}{%\n  \\item Do not begin until instructed to do so.\n  \\item Read each question carefully.\n  \\item Show your work where instructed; partial credit requires visible reasoning.\n}\n\n% Student-info rows on the cover (shown with \\showstudentinfotrue).\n% Redefine to change the fields, using \\InfoBoxRow, \\InfoBoxRowPair,\n% \\InfoLineRow or \\DigitBubbles.\n\\newcommand{\\StudentInfo}{%\n  \\InfoBoxRow{Last Name}{16}\n  \\InfoBoxRow{First Name}{16}\n  \\InfoBoxRowPair{UTORId (e.g. \\texttt{gummalur})}{8}{Student \\#}{10}\n}\n\n% ---- dotted-leader helper, e.g. \"Duration:\\cdotfill 90 minutes\" -----------\n% (\"@\" is a letter throughout a .cls file, so no \\makeatletter is needed.)\n\\newcommand\\cdotfill{%\n  \\leavevmode\\cleaders\\hb@xt@.44em{\\hss.\\hss}\\hfill\\kern\\z@\n}\n\n% ---- blank space at the top of every page, for scanner codes ---------------\n% Use in the preamble, e.g. \\SetScanMargin{1.5cm}.\n\\newlength{\\CT@scan}\n\\newcommand{\\SetScanMargin}[1]{%\n  \\setlength{\\CT@scan}{#1}%\n  \\geometry{top=\\dimexpr1.75in+#1\\relax}%\n}\n\n% ============================================================================\n%  SOLUTIONS AND MARKING\n%  solution: shown only with solutions on. Built on the comment package,\n%  which reads the body line by line, so \\begin{lstlisting} works inside and\n%  nothing leaks into the student copy. Keep \\begin{solution} and\n%  \\end{solution} on lines of their own.\n%  marking: rubric comments, shown only with marking on, e.g.\n%    \\begin{marking}{Start at full}\n%      \\rubric{-1}{Missed the carry into bit 4}\n%    \\end{marking}\n% ============================================================================\n\\definecolor{solutionrule}{gray}{0.7}\n\\newcommand{\\CT@SolutionRule}{\\noindent\\textcolor{solutionrule}{\\rule{\\linewidth}{0.8pt}}\\par}\n\\AtBeginDocument{%\n  \\ifshowsolutions\n    \\specialcomment{solution}{%\n      \\par\\addvspace{12pt}\\CT@SolutionRule\\nobreak\n      \\addvspace{4pt}%\n      \\noindent\\textbf{Solution.}\\par\\nobreak\\smallskip\n      \\begin{quote}%\n    }{%\n      \\end{quote}%\n      \\nobreak\\addvspace{4pt}\\CT@SolutionRule\n      \\addvspace{12pt}%\n    }%\n  \\else\n    \\excludecomment{solution}%\n  \\fi\n}\n\\newcommand{\\ansnt}[1]{\\ifshowsolutions #1\\else\\phantom{#1}\\fi}\n\n\\NewEnviron{marking}[1]{%\n  \\ifshowmarking\n    \\par\\addvspace{6pt}%\n    {\\small\\noindent\\textbf{Marking.} #1\\par\\nobreak\n     \\BODY\\par}%\n    \\addvspace{6pt}%\n  \\fi\n}\n\\newcommand{\\rubric}[2]{\\par\\noindent\\makebox[3.2em][r]{$#1$}\\quad #2}\n\n% Answer space: blank space in the student copy, nothing in the key.\n\\newcommand{\\answerspace}[1]{\\ifshowsolutions\\else\\par\\vspace{#1}\\fi}\n\n% ============================================================================\n%  STYLE -- black & white, simple.\n% ============================================================================\n\\titleformat{\\section}\n  {\\normalfont\\Large\\bfseries}{\\thesection}{0.75em}{}[{\\titlerule[0.8pt]}]\n\\titleformat{\\subsection}\n  {\\normalfont\\large\\bfseries}{\\thesubsection}{0.75em}{}\n\\titleformat{\\subsubsection}\n  {\\normalfont\\normalsize\\bfseries\\itshape}{\\thesubsubsection}{0.75em}{}\n\\titlespacing*{\\section}{0pt}{14pt}{6pt}\n\\titlespacing*{\\subsection}{0pt}{10pt}{4pt}\n\n% ---- Header / footer ---------------------------------------------------------\n\\pagestyle{fancy}\n\\fancyhf{}\n\\renewcommand{\\headrulewidth}{0.6pt}\n\\renewcommand{\\footrulewidth}{0.4pt}\n\\lhead{\\CourseCode}\n\\chead{\\DocTitle}\n\\rhead{\\Term}\n\\lfoot{\\CourseCode\\ -- \\Term\\ifdefempty{\\Version}{}{\\ -- Version \\Version}}\n\\cfoot{}\n\\rfoot{\\ifshowpagenumbers Page \\thepage\\ of \\pageref{LastPage}\\fi}\n\n\\fancypagestyle{plain}{%\n  \\fancyhf{}\n  \\renewcommand{\\headrulewidth}{0pt}\n  \\renewcommand{\\footrulewidth}{0pt}\n}\n\n% Answer key and marking guide: say so in the title, and leave out the\n% student-info boxes.\n\\AtBeginDocument{%\n  \\ifshowmarking\n    \\appto\\DocTitle{ --- Marking Guide}\\showstudentinfofalse\n  \\else\\ifshowsolutions\n    \\appto\\DocTitle{ --- Solutions}\\showstudentinfofalse\n  \\fi\\fi\n}\n\n% ============================================================================\n%  STUDENT-INFO BOXES AND COVER PAGE\n% ============================================================================\n\n% Every student box is the same size, \\StudentBoxSize: a sixteenth of the\n% text width unless you set it, e.g. \\setlength{\\StudentBoxSize}{9mm}.\n% A row with more boxes than fit on the line shrinks to fit.\n\\newlength{\\StudentBoxSize}\n\\AtBeginDocument{\\ifdim\\StudentBoxSize=0pt \\setlength{\\StudentBoxSize}{\\dimexpr\\textwidth/16\\relax}\\fi}\n\n% A row of n square boxes.\n\\newcommand{\\CharBoxes}[1]{%\n  \\pgfmathsetlengthmacro{\\CT@boxlen}{min(\\StudentBoxSize, \\linewidth/#1)}%\n  \\begin{tikzpicture}[baseline=-0.5ex, x=\\CT@boxlen, y=\\CT@boxlen]\n    \\foreach \\i in {0,...,\\numexpr#1-1\\relax} {\n      \\draw[black, line width=0.7pt] (\\i,0) rectangle ++(1,1);\n    }\n  \\end{tikzpicture}%\n}\n\n\\newcommand{\\InfoBoxRow}[2]{%\n  \\noindent{\\small\\bfseries #1}\\\\[2pt]\n  \\noindent\\CharBoxes{#2}\\\\[6pt]%\n}\n\n% Two box rows side by side, one box apart, so their boxes line up with the\n% rows above and below (same box size as every other row).\n\\newcommand{\\InfoBoxRowPair}[4]{%\n  \\pgfmathsetlengthmacro{\\CT@pairbox}{min(\\StudentBoxSize, \\linewidth/(#2+#4+1))}%\n  \\pgfmathsetlengthmacro{\\CT@pairgap}{\\CT@pairbox}%\n  \\pgfmathsetlengthmacro{\\CT@pairwa}{\\CT@pairbox*#2}%\n  \\pgfmathsetlengthmacro{\\CT@pairwb}{\\CT@pairbox*#4}%\n  \\noindent\n  \\begin{minipage}[t]{\\CT@pairwa}\n    {\\small\\bfseries #1}\\\\[2pt]\n    \\CharBoxes{#2}%\n  \\end{minipage}%\n  \\hspace{\\CT@pairgap}%\n  \\begin{minipage}[t]{\\CT@pairwb}\n    {\\small\\bfseries #3}\\\\[2pt]\n    \\CharBoxes{#4}%\n  \\end{minipage}\\\\[6pt]%\n}\n\n% A label and a line to write on, e.g. \\InfoLineRow{Signature}{8cm}.\n\\newcommand{\\InfoLineRow}[2]{%\n  \\noindent{\\small\\bfseries #1}\\\\[14pt]\n  \\noindent\\rule{#2}{0.5pt}\\\\[8pt]%\n}\n\n% A box per digit with a column of 0-9 bubbles under it, for scanned exams.\n\\newcommand{\\DigitBubbles}[2]{%\n  \\noindent{\\small\\bfseries #1}\\\\[2pt]\n  \\noindent\\begin{tikzpicture}[x=7mm, y=-4.6mm]\n    \\foreach \\i in {0,...,\\numexpr#2-1\\relax} {\n      \\draw[black, line width=0.7pt] (\\i+0.05,-2.1) rectangle ++(0.9,1.55);\n      \\foreach \\d in {0,...,9}\n        \\draw[black, line width=0.4pt] (\\i+0.5,\\d) circle (1.7mm) node[font=\\tiny] {\\d};\n    }\n  \\end{tikzpicture}\\\\[6pt]%\n}\n\n% ---- points table, built from the previous run's .aux data -----------------\n% Shows \"(compile again)\" on the first pass, before question data exists.\n\\newcounter{CT@i}\n\n\\newcommand{\\CT@BuildRows}{%\n  \\def\\CT@RowQ{}%\n  \\def\\CT@RowP{}%\n  \\def\\CT@RowS{}%\n  \\setcounter{CT@i}{1}%\n  \\whiledo{\\value{CT@i}<\\numexpr\\CT@numquestions+1\\relax}{%\n    \\ifnum\\value{CT@i}=1\n      \\edef\\CT@RowQ{\\arabic{CT@i}}%\n      \\edef\\CT@RowP{\\csname CT@qpts@\\arabic{CT@i}\\endcsname}%\n      \\g@addto@macro{\\CT@RowS}{\\rule{0pt}{0.6cm}}%\n    \\else\n      \\edef\\CT@RowQ{\\CT@RowQ &\\arabic{CT@i}}%\n      \\edef\\CT@RowP{\\CT@RowP &\\csname CT@qpts@\\arabic{CT@i}\\endcsname}%\n      \\g@addto@macro{\\CT@RowS}{&\\rule{0pt}{0.6cm}}%\n    \\fi\n    \\stepcounter{CT@i}%\n  }%\n}\n\n% The blank row for writing marks (left out with \\showscorerowfalse).\n\\newcommand{\\CT@ScoreRow}{Score: & \\CT@RowS & \\\\ \\hline}\n\\newcommand{\\CT@PointsTable}{%\n  \\@ifundefined{CT@numquestions}{%\n    \\textit{(points table will appear after you compile again)}%\n  }{%\n    \\CT@BuildRows\n    \\begingroup\n    \\setlength{\\tabcolsep}{5pt}%\n    \\setlength{\\arrayrulewidth}{0.7pt}%\n    \\small\n    \\begin{tabular}{|l|*{\\CT@numquestions}{c|}c|}\n      \\hline\n      Question: & \\CT@RowQ & \\textbf{Total} \\\\\n      \\hline\n      Points: & \\CT@RowP & \\textbf{\\total{gtpoints}} \\\\\n      \\hline\n      \\ifshowscorerow\\CT@ScoreRow\\fi\n    \\end{tabular}%\n    \\endgroup\n  }%\n}\n\n\\newcommand{\\CT@MetaRow}[2]{%\n  \\ifdefempty{#2}{}{\\noindent #1\\cdotfill #2\\par}%\n}\n\n% One-page cover: title block, metadata, student info, points table,\n% instructions, \"Good luck!\". Optional pieces follow the \\ifshow... switches\n% (or \\Duration etc. being non-empty). If several long blocks overflow onto a\n% second page, shorten \\CoverInstructionsList.\n\\newcommand{\\MakeCoverPage}{%\n  \\thispagestyle{empty}\n  \\newgeometry{margin=1in, top=\\dimexpr1.25in+\\CT@scan\\relax, footskip=0.5in}%\n  \\begin{center}\n\n  \\vspace*{0pt}\n  {\\large\\scshape \\University\\par}\n  {\\Large \\Department \\par}\n\n  \\vspace{9pt}\n  {\\Large \\CourseCode\\par}\n  \\vspace{1pt}\n  {\\large \\CourseName\\par}\n  \\vspace{4pt}\n  {\\LARGE\\bfseries \\DocTitle\\par}\n  \\vspace{2pt}\n  {\\large \\Term\\par}\n\n  \\vspace{7pt}\n  \\rule{0.75\\textwidth}{0.5pt}\\par\n  \\vspace{3pt}\n\n  \\begingroup\n  \\begin{minipage}{0.75\\textwidth}\n    \\setlength{\\parskip}{3pt}\\setlength{\\parindent}{0pt}\n    \\CT@MetaRow{Instructor(s)}{\\Instructors}\n    \\CT@MetaRow{Date}{\\ExamDate}\n    \\CT@MetaRow{Duration}{\\Duration}\n    \\CT@MetaRow{Due}{\\Due}\n    \\CT@MetaRow{Weight}{\\Weight}\n    \\CT@MetaRow{Version}{\\Version}\n    \\ifshowaidsallowed\n      \\noindent Aids Allowed\\cdotfill\n      \\begin{varwidth}[t]{0.5\\linewidth}\\raggedright\n        \\begin{itemize}[leftmargin=0pt, itemsep=1pt, topsep=0pt, parsep=0pt, label={}]\n          \\AidsAllowedList\n        \\end{itemize}\n      \\end{varwidth}\\par\n    \\fi\n  \\end{minipage}\n  \\endgroup\n\n  \\vspace{3pt}\n  \\rule{0.75\\textwidth}{0.5pt}\\par\n\n  \\end{center}\n\n  \\ifshowstudentinfo\n    \\vspace{7pt}\n    \\StudentInfo\n  \\fi\n\n  \\ifshowpointstable\n    \\vspace{7pt}\n    \\begin{center}\n    \\CT@PointsTable\n    \\end{center}\n  \\fi\n\n  \\ifshowcoverinstructions\n    \\vspace{7pt}\n    \\noindent\\large \\textbf{Instructions}\n    \\normalsize\n    \\begin{itemize}[leftmargin=2em, itemsep=0.5pt, topsep=1pt]\n      \\CoverInstructionsList\n    \\end{itemize}\n  \\fi\n\n  \\ifshowgoodluck\n    \\vspace{7pt}\n    \\begin{center}\n    \\textit{Good luck!}\n    \\end{center}\n  \\fi\n\n  \\newpage\n  \\restoregeometry\n}\n\n% A labelled rough-work page (left out of the answer key and marking guide).\n\\newcommand{\\RoughWorkPage}{%\n  \\ifshowsolutions\\else\n    \\clearpage\n    \\begin{center}\n      {\\large\\bfseries This page is for rough work.}\\\\[3pt]\n      \\textit{Nothing on this page will be marked unless you clearly indicate,\\\\\n      in the space provided for that question, that your answer continues here.}\n    \\end{center}\n    \\vfill\\null\n  \\fi\n}\n\n% Closing line with the exam's total.\n\\newcommand{\\EndOfExam}{%\n  \\par\\bigskip\n  \\begin{center}\n  \\rule{0.5\\textwidth}{0.4pt}\\\\[6pt]\n  \\textbf{End of Examination.} This examination is out of a total of \\textbf{\\total{gtpoints} marks}.\n  \\end{center}\n}\n\n% ============================================================================\n%  POINTS ENGINE\n%  \\begin{questions} ... \\end{questions}, \\question[n], \\begin{parts} ...\n%  \\end{parts}, \\qpart[n]. Points are whole numbers (LaTeX counters).\n%  Give points to \\question[n] only if it has no parts; otherwise leave it\n%  empty and give points to each \\qpart[n].\n% ============================================================================\n\\newcounter{question}\n\\newcounter{ctpart}\n\\newcounter{qpoints}\n\\newcounter{gtpoints}\n\\regtotcounter{gtpoints}\n\n% Fillable box (\"___ / 10\") by default; the starred forms of \\question and\n% \\qpart give a plain box (\"10 points\") for ungraded handouts.\n\\newcommand{\\CT@PointsBoxFillable}[1]{%\n  \\fbox{\\rule[-0.2\\baselineskip]{0pt}{0.75\\baselineskip}\\hspace{0.3in} / #1}%\n}\n\\newcommand{\\CT@PointsBoxPlain}[1]{%\n  \\fbox{\\small #1~point\\ifnum#1=1\\else s\\fi}%\n}\n\\newcommand{\\FillPointsBox}[1]{\\CT@PointsBoxFillable{#1}}\n\\newcommand{\\PlainPointsBox}[1]{\\CT@PointsBoxPlain{#1}}\n\n\\newcommand{\\CT@FinalizeQuestion}{%\n  \\ifnum\\value{question}>0\n    \\immediate\\write\\@auxout{%\n      \\string\\expandafter\\string\\gdef\\string\\csname\\space\n      CT@qpts@\\arabic{question}\\string\\endcsname\\string{\\arabic{qpoints}\\string}%\n    }%\n  \\fi\n}\n\n\\newenvironment{questions}{%\n  \\setcounter{question}{0}%\n  \\setcounter{gtpoints}{0}%\n  \\begin{list}{}{\\labelwidth=0pt\\leftmargin=0pt\\itemsep=12pt\\topsep=6pt}\n}{%\n  \\end{list}\n  \\CT@FinalizeQuestion\n  \\immediate\\write\\@auxout{\\string\\gdef\\string\\CT@numquestions{\\arabic{question}}}%\n}\n\n\\newcommand{\\CT@question}[2]{%\n  % #1 = points (possibly empty), #2 = fillable or plain\n  \\CT@FinalizeQuestion\n  \\stepcounter{question}%\n  \\setcounter{qpoints}{0}%\n  \\setcounter{ctpart}{0}%\n  \\item[]\\textbf{Question \\arabic{question}}%\n  \\def\\CT@qarg{#1}%\n  \\ifx\\CT@qarg\\@empty\n    % Points come from the parts: show last run's total, without adding it.\n    \\@ifundefined{CT@qpts@\\arabic{question}}{}{%\n      \\ \\ifthenelse{\\equal{#2}{plain}}{\\CT@PointsBoxPlain{\\csname CT@qpts@\\arabic{question}\\endcsname}}{\\CT@PointsBoxFillable{\\csname CT@qpts@\\arabic{question}\\endcsname}}%\n    }%\n  \\else\n    \\ \\ifthenelse{\\equal{#2}{plain}}{\\CT@PointsBoxPlain{#1}}{\\CT@PointsBoxFillable{#1}}%\n    \\addtocounter{qpoints}{#1}%\n    \\addtocounter{gtpoints}{#1}%\n  \\fi\n  \\hspace{0.4em}\\ignorespaces\n}\n\\newcommand{\\CT@questionfillable}[1][]{\\CT@question{#1}{fillable}}\n\\newcommand{\\CT@questionplain}[1][]{\\CT@question{#1}{plain}}\n\\newcommand{\\question}{\\@ifstar{\\CT@questionplain}{\\CT@questionfillable}}\n\n\\newenvironment{parts}{%\n  \\begin{list}{(\\alph{ctpart})}{\\usecounter{ctpart}\\leftmargin=2.2em\\itemsep=6pt\\topsep=4pt}\n}{%\n  \\end{list}\n}\n\n\\newcommand{\\CT@qpart}[2]{%\n  \\item%\n  \\def\\CT@partarg{#1}%\n  \\ifx\\CT@partarg\\@empty\n  \\else\n    \\ifthenelse{\\equal{#2}{plain}}{\\CT@PointsBoxPlain{#1}}{\\CT@PointsBoxFillable{#1}}%\n    \\addtocounter{qpoints}{#1}%\n    \\addtocounter{gtpoints}{#1}%\n  \\fi\n  \\ \\ignorespaces\n}\n\\newcommand{\\CT@qpartfillable}[1][]{\\CT@qpart{#1}{fillable}}\n\\newcommand{\\CT@qpartplain}[1][]{\\CT@qpart{#1}{plain}}\n\\newcommand{\\qpart}{\\@ifstar{\\CT@qpartplain}{\\CT@qpartfillable}}\n\n% Sub-parts (i), (ii) inside a part. A part that has sub-parts takes no\n% points itself; \\partpoints{n} shows its total in a box without counting it.\n\\newcounter{ctsubpart}\n\\newenvironment{subparts}{%\n  \\begin{list}{(\\roman{ctsubpart})}{\\usecounter{ctsubpart}\\leftmargin=2.2em\\itemsep=6pt\\topsep=4pt}\n}{%\n  \\end{list}\n}\n\\newcommand{\\subpart}[1][]{%\n  \\item%\n  \\def\\CT@subarg{#1}%\n  \\ifx\\CT@subarg\\@empty\\else\n    \\CT@PointsBoxFillable{#1}%\n    \\addtocounter{qpoints}{#1}%\n    \\addtocounter{gtpoints}{#1}%\n  \\fi\n  \\ \\ignorespaces\n}\n\\newcommand{\\partpoints}[1]{\\CT@PointsBoxFillable{#1}\\ \\ignorespaces}\n\n% ============================================================================\n%  TABLES -- booktabs rules, captioned and centred.\n%    \\begin{cleantable}{Caption} \\begin{tabular}{ll} ... \\end{tabular} \\end{cleantable}\n% ============================================================================\n\\newenvironment{cleantable}[2][htbp]{%\n  \\begin{table}[#1]\n  \\centering\n  \ // ── Rich text boxes ──────────────────────────────────────────────────

const TEX_ESC = { "\\": "\\textbackslash{}", "{": "\\{", "}": "\\}", $: "\\$", "&": "\\&", "#": "\\#", _: "\\_", "%": "\\%", "^": "\\^{}" };

    if (c.classList.contains("codeblk")) {
      const code = (($(".code-code", c) || {}).innerText || "").replace(/^\n+|\s+$/g, "");
      const opts = [`style=${c.dataset.style || "struct"}`, c.dataset.extra].filter(Boolean).join(", ");
      return code ? `\n\\begin{lstlisting}[${opts}]\n${code}\n\\end{lstlisting}\n` : "";
    }
    if (c.classList.contains("tikz")) { const code = ($(".tikz-code", c) || {}).innerText || ""; return code.trim() ? (c.dataset.center === "1" ? `\n\\begin{center}\n${code.trim()}\n\\end{center}\n` : `\n${code.trim()}\n`) : ""; }
    switch (c.nodeName) {
      case "BR": return "\n";
      case "B": case "STRONG": return wrap("\\textbf", kids(c));
      case "I": case "EM": return wrap("\\textit", kids(c));
      case "U": return wrap("\\underline", kids(c));
      case "UL": case "OL": { const env = c.nodeName === "UL" ? "itemize" : "enumerate"; return `\n\\begin{${env}}\n${[...c.children].map(li => `\\item ${kids(li).replace(/\n+$/, "").trim()}`).join("\n")}\n\\end{${env}}\n`; }
      case "DIV": case "P": { const x = kids(c); return `\n${x === "\n" ? "" : x}`; }
      default: return kids(c);
    }
  };
  return kids(el).replace(/^\n+/, "").replace(/\n+(\\begin\{(?:itemize|enumerate|center|tikzpicture|lstlisting)\})/g, "\n$1").replace(/(\\item [^\n]*)\n(\\begin\{(?:itemize|enumerate)\})/g, "$1\n$2").replace(/\n{3,}/g, "\n\n").replace(/\s+$/, "").replace(/^\n/, "");
}

// ── App state ────────────────────────────────────────────────────────
// sel: the selected block: an item's id, "cover", or null. path: the
// sub-question within a question ("parts.0"), "" for the question itself.
const ui = { version: 0, output: "student", sel: null, path: "" };
let GH_W = "GitHub", GH_ON = "on GitHub", GH_TO = "to GitHub";   // in Lectern's folder mode: your folder
const gh = { repo: "", branch: "main", token: "", path: "", sha: null, last: "", copyFrom: "" };
let model = BLANK_EXAM();
let fileName = "";
let unsaved = false;
let quietSave = false;   // Lectern's one Save: no dialog and no message of the builder's own
let undoStack = [], redoStack = [];
const stage = $("#stage");
const statusEl = $("#status");

function updateStatus() {
  const where = gh.path ? `<span class="st-path">${esc(gh.path.replace(/\/exam\.json$/, ""))}</span>` : fileName ? `<span class="st-path">${esc(fileName)}</span>` : "";
  const pill = unsaved ? `<span class="st-pill">${svg("warn")}${gh.path ? `Not saved ${GH_TO}` : "Unsaved"}</span>` : "";
  statusEl.innerHTML = where + pill;
  document.title = `${model.settings.title || "Untitled exam"} · Exam Builder`;
}
let typingTimer = 0;
const pushUndo = () => { undoStack.push(JSON.stringify(model)); if (undoStack.length > 300) undoStack.shift(); redoStack = []; };
// A structural change: one undo step, then redraw the page.
function change(fn) { pushUndo(); clearTimeout(typingTimer); typingTimer = 0; fn(); unsaved = true; render(); }
// Typing: one undo step per burst of typing; the page isn't redrawn.
function noteTyping() { if (!typingTimer) pushUndo(); clearTimeout(typingTimer); typingTimer = setTimeout(() => { typingTimer = 0; }, 900); unsaved = true; }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(model)); model = JSON.parse(undoStack.pop()); unsaved = true; render(); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(model)); model = JSON.parse(redoStack.pop()); unsaved = true; render(); }

const itemById = id => (id === "settings" ? model.settings : id === "cover" ? model.cover : model.items.find(it => it.id === id));
const selIndex = () => model.items.findIndex(it => it.id === ui.sel);
// The variant shown (and edited) for a question is the one for the version on screen.
const shownVariant = q => variantFor(q, ui.version) || q.variants[0];
const nodeAt = (q, path) => (path ? getP(shownVariant(q), path) : shownVariant(q));

function render() {
  MACROS = parseMacros(model.settings.macros);
  if (ui.version >= model.settings.versions) ui.version = 0;
  if (!["edit", "preview"].includes(ui.output)) ui.output = "edit";   // (the settings now live in the edit bar and at the top of the page)   // editing (with the solutions and rubric), the student preview, and settings
  if (ui.sel && ui.sel !== "cover" && selIndex() < 0) { ui.sel = null; ui.path = ""; }
  if (ui.sel && ui.sel !== "cover" && (!isQ(itemById(ui.sel)) || !nodeAt(itemById(ui.sel), ui.path))) ui.path = "";
  if (!$("#sheet")) stage.innerHTML = `<div class="shell"><section class="ed-col"><nav class="crumbs sp-crumbs" id="pv-crumb" hidden><span class="cur">Student Preview</span></nav><div class="ed-paper" id="sheet"></div><div class="setpage" id="setpage" hidden></div>
      <div class="addbar">
        <button type="button" class="btn main" data-act="add-q">Add question</button>
        <button type="button" class="btn" data-act="add" data-kind="break">Page break</button>
        <button type="button" class="btn" data-act="add" data-kind="rough">Rough-work page</button>
        <button type="button" class="btn" data-act="add" data-kind="page">Content page</button></div></section>
</div>
      <section class="dock" id="dock" aria-label="Checks and points"></section>`;
  closePops();
  const S = model.settings, N = S.versions;
  const seg = (act, opts, cur) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${String(v) === String(cur)}">${l}</button>`).join("")}</div>`;
  // The top bar has no view switch or zoom: the gear and Fit float over the page, the marking guide is a tick in the edit bar.
  $("#tb-view").innerHTML = ""; $("#tb-right").innerHTML = "";
  drawFloat();
  const tbh = $(".tb").offsetHeight; if (tbh) document.documentElement.style.setProperty("--tbh", `${tbh}px`);   // the question toolbar sticks just below it
  applyZoom();
  // The settings page replaces the exam while it's open.
  const onSettings = ui.output === "settings";
  $("#sheet").hidden = onSettings; $(".addbar").hidden = onSettings; $("#setpage").hidden = !onSettings;
  document.body.classList.toggle("on-settings", onSettings);   // the warm page background, as the other tools' pages
  if (onSettings) { ui.sel = null; ui.path = ""; $("#setpage").innerHTML = settingsPageHTML(); placeToolbar(); refreshDerived(); updateStatus(); return; }
  const y = window.scrollY;
  $("#sheet").className = `ed-paper mode-${ui.output}`;
  { const pc = $("#pv-crumb"); if (pc) pc.hidden = ui.output !== "preview"; }
  $("#sheet").innerHTML = sheetHTML();
  $$("#sheet .ed.ro [contenteditable]").forEach(e => e.setAttribute("contenteditable", "false"));   // figures and code inside read-only text
  window.scrollTo(0, y);
  placeToolbar();
  refreshDerived();
  updateStatus();
}

// Things computed from the whole exam (totals, checks) update while typing
// without redrawing the block being typed in.
function refreshDerived() {
  const probs = checks();
  drawDock(probs);
  const probAt = new Map(); probs.forEach(p => { if (p.i != null) probAt.set(p.i, (probAt.get(p.i) || 0) + 1); });
  $$("#sheet .blk-warn").forEach(el => { const n = probAt.get(+el.dataset.i) || 0; el.hidden = !n; el.innerHTML = `${svg("warn")}${n}`; });
  $$("#sheet [data-ptsof]").forEach(el => { const [id, path] = el.dataset.ptsof.split("|"), q = itemById(id), n = q && nodeAt(q, path); if (n) el.textContent = fmtNum(Math.round(nodePoints(n))); });
  $$("#sheet [data-rbof]").forEach(el => { const [id, path] = el.dataset.rbof.split("|"), q = itemById(id), n = q && nodeAt(q, path), w = $(".rb-warn", el); if (n && w) w.innerHTML = rbWarn(n, q); });
  const t = $("#sheet .eoe b.eoe-tot"); if (t) t.textContent = fmtPts(total(ui.version));
  const pt = $("#sheet .cv-pts"); if (pt && !pt.contains(document.activeElement)) pt.outerHTML = pointsTableHTML(ui.version);
  updateStatus();
}

// ── The sheet ────────────────────────────────────────────────────────
const pageLine = t => `<div class="pbreak"><span>${esc(t)}</span></div>`;
// A plain-text field edited in place (settings, cover text).
// In the marking guide only the solutions and rubric are editable; everything else is shown read-only.
const guide = () => false;   // (there's no read-only marking guide view any more: solutions and rubric are always shown while editing)
const plainEd = (owner, f, value, ph, cls = "") => guide()
  ? `<span class="ed plain ro${cls ? " " + cls : ""}">${esc(value)}</span>`
  : `<span class="ed plain${cls ? " " + cls : ""}" contenteditable="plaintext-only" spellcheck="false" data-item="${owner}" data-f="${f}" data-ph="${esc(ph)}">${esc(value)}</span>`;
// Lines edited in place, one per line (aids, instructions).
const linesEd = (owner, f, value, ph) => `<ul class="ed lines${guide() ? " ro" : ""}" contenteditable="${!guide()}" data-item="${owner}" data-f="${f}" data-ph="${esc(ph)}">${String(value || "").split("\n").map(x => x.trim()).filter(Boolean).map(x => `<li>${esc(x.replace(/^\\item\s*/, ""))}</li>`).join("") || "<li><br></li>"}</ul>`;
// Rich text edited in place: formatting shows as itself, maths and answer pieces as chips.
const richIn = (itemId, f, value, comps, ph, cls = "") => `<div class="ed rich${cls ? " " + cls : ""}${guide() && cls !== "sol-body" ? " ro" : ""}" contenteditable="${!guide() || cls === "sol-body"}" spellcheck="true" data-item="${itemId}" data-f="${f}"${comps ? " data-comps" : ""} data-ph="${esc(ph)}">${texToRich(value, comps)}</div>`;

function sheetHTML() {
  const S = model.settings, nums = numbering(), vi = ui.version, mode = ui.output === "preview" ? "student" : "edit";
  const C = model.cover, parts = [];
  if (mode === "edit") parts.push(preHTML(S));
  else if (num(S.topSpace) > 0) parts.push(`<div class="top-space-pv" style="height:${esc(cm(num(S.topSpace)))}"></div>`);
  if (C.on) parts.push(`<div class="blk cover-blk${ui.sel === "cover" ? " sel" : ""}" data-sel="cover" data-path="">${coverHTML(vi, mode)}</div>`, pageLine("New page"));
  else if (!guide() && !handout()) parts.push(`<button type="button" class="add-cover" data-act="cover-on">Add a cover page</button>`);
  const title = (S.title || "") + (mode === "guide" ? " — Marking Guide" : "");
  parts.push(`<div class="sheet-head ed-head">${plainEd("settings", "courseCode", S.courseCode, "Course code")}<span>${mode !== "guide" ? plainEd("settings", "title", S.title, "Exam title") : esc(title)}</span>${plainEd("settings", "term", S.term, "Term")}</div>`);
  if (handout() && !C.on) parts.push(`<div class="ho-head">${S.date ? `<p class="ho-due">Due ${esc(S.date)}</p>` : ""}<div class="ho-ins"><b>Instructions</b>${linesEd("settings", "instructions", S.instructions, "Instructions for the assignment, one per line")}</div></div>`);
  const endsPage = it => !isQ(it) || (() => { const v = variantFor(it, vi); return !!v && endsWithFill(v); })();
  model.items.forEach((it, i) => parts.push(blockHTML(it, i, nums[i], vi, i > 0 && endsPage(model.items[i - 1]), mode)));
  if (!model.items.length) parts.push(`<div class="ed-empty"><b>No questions yet</b>Use Add question below.</div>`);
  parts.push(handout() ? `<div class="eoe"><i></i>This assignment is out of a total of <b class="eoe-tot">${fmtPts(total(vi))}</b>.</div>`
    : `<div class="eoe"><i></i><b>End of Examination.</b> This examination is out of a total of <b class="eoe-tot">${fmtPts(total(vi))}</b>.</div>`);
  return parts.join("");
}

function blockHTML(it, i, n, vi, fresh, mode) {
  const last = model.items.length - 1, lead = fresh ? "" : pageLine("New page"), sel = ui.sel === it.id && !ui.path ? " sel" : "";
  const ctl = guide() ? "" : `<div class="blk-ctl">
      <button type="button" class="ic" data-act="up" data-i="${i}" title="Move up" aria-label="Move up"${i === 0 ? " disabled" : ""}>${svg("up")}</button>
      <button type="button" class="ic" data-act="down" data-i="${i}" title="Move down" aria-label="Move down"${i === last ? " disabled" : ""}>${svg("down")}</button>
      ${isQ(it) ? `<button type="button" class="ic" data-act="dup" data-i="${i}" title="Duplicate" aria-label="Duplicate">${svg("copy")}</button>` : ""}
      <button type="button" class="ic trash" data-act="del" data-i="${i}" title="Delete" aria-label="Delete">${svg("trash")}</button></div>`;
  const attrs = cls => `class="it ${cls}${sel}" data-i="${i}" data-sel="${esc(it.id)}" data-path=""`;
  const grip = guide() ? "" : `<span class="grip" draggable="true" title="Drag to move" aria-hidden="true">${svg("grip")}</span>`;
  if (it.kind === "break") return `<div ${attrs("pbreak manual")}>${grip}<span>${fresh ? "Page break (the page already ended)" : "Page break"}</span>${ctl}</div>`;
  if (it.kind === "rough") return `<div ${attrs("blk rough")}>${grip}${mode !== "student" ? `<p class="ed-ph" style="text-align:center;margin:4px 0">Rough-work page (left out of the answer key)</p>` : `${lead}
      <div class="pg-center"><b>This page is for rough work.</b><br><i>Nothing on this page will be marked unless you clearly indicate,<br>in the space provided for that question, that your answer continues here.</i></div>
      <div class="rough-rest">Rest of the page left blank</div>${pageLine("New page")}`}${ctl}</div>`;
  if (it.kind === "page") return `<div ${attrs("blk")}>${grip}${lead}
      <div class="pg-title">${plainEd(it.id, "title", it.title, "Title")}</div>${richIn(it.id, "body", it.body, null, "Content: a formula sheet, extra instructions…", "page-body")}
      ${pageLine("New page")}${ctl}</div>`;
  const v = variantFor(it, vi);
  return `<div ${attrs("blk q")}>${grip}
      <span class="blk-warn" data-i="${i}" hidden title="See Checks"></span>
      ${it.newPage ? lead : ""}${v ? nodeHTML(v, { mode, depth: 0, label: `Question ${n}`, path: "", item: it, base: `variants.${it.variants.indexOf(v)}` })
        : `<b>Question ${n}</b> <span class="tx-box">No variant ${LET(vi)} for this question</span> <button type="button" class="link" data-act="addvar-here" data-i="${i}">Add one</button>`}
      ${guide() ? "" : metaHTML(it)}
      ${ctl}</div>`;
}

// Tags and a private note, under the question on the page (never printed; the strip is styled as editor UI, not exam text).
function metaHTML(q) {
  const id = esc(q.id);
  return `<div class="qmeta${q.tags.length || q.notes ? " has" : ""}" contenteditable="false">
    <span class="qm-tags">${q.tags.map((t, k) => `<span class="qm-tag">${esc(t)}<button type="button" data-act="tagdel" data-item="${id}" data-j="${k}" title="Remove this tag" aria-label="Remove tag ${esc(t)}">×</button></span>`).join("")}<input class="qm-add" data-item="${id}" placeholder="${q.tags.length ? "Add a tag" : "Add a tag (e.g. adders, hard)"}" aria-label="Add a tag" size="${q.tags.length ? 10 : 28}"></span>
    <span class="qm-note ed plain" contenteditable="plaintext-only" spellcheck="true" data-item="${id}" data-f="notes" data-ph="Private note…">${esc(q.notes)}</span>
  </div>`;
}

// Answer components as the class prints them. In the student copy the
// answer shows faintly (for you, not the students); in the key, plainly.
function compHTML(c) {
  const ans = s => (String(s ?? "").trim() ? `<span class="ans">${texToHtml(String(s)).replace(/^<div class="tx-p">([\s\S]*?)<\/div>$/, "$1")}</span>` : "");
  switch (c.kind) {
    case "blank": return `<span class="c-blank" style="width:${esc(cm(c.len))}">${ans(c.ans)}</span>`;
    case "box": return `<span class="c-box" style="width:${esc(cm(c.w))};height:${esc(cm(c.h))}">${ans(c.ans)}</span>`;
    case "num": return `<span class="c-box c-num" style="width:${esc(cm(c.w))}">${ans(c.ans)}</span>`;
    case "frac": return `<span class="c-frac"><span class="c-box c-num" style="width:${esc(cm(c.w))}">${ans(c.num)}</span><i></i><span class="c-box c-num" style="width:${esc(cm(c.w))}">${ans(c.den)}</span></span>`;
    case "cells": { const n = Math.min(30, Math.max(1, Math.round(num(c.n)) || 1)), xs = String(c.ans || "").split(","); return `<span class="c-cells">${Array.from({ length: n }, (_, k) => `<span style="width:${esc(cm(c.cell))};height:${esc(cm(c.cell))}">${ans(xs[k])}</span>`).join("")}</span>`; }
  }
  return "";
}
// In a rich text box, an answer component is a chip that looks like the printed piece.
const chipHTML = (id, c) => `<span class="chip" contenteditable="false" data-c="${id}" data-act="comp" title="${COMPS[c.kind].label}: click to set its answer">${compHTML(c)}</span>`;

// A question or sub-question, editable in place.
function nodeHTML(n, ctx) {
  const { mode, depth, label, path, item, base } = ctx, showSol = mode !== "student", showMark = mode !== "student", has = n.parts.length > 0;
  const id = item.id, f = p => `${base}${path ? "." + path : ""}.${p}`;
  const pts = has ? `<span class="ptbox">/ <span data-ptsof="${esc(id)}|${path}">${fmtNum(Math.round(nodePoints(n)))}</span></span>`
    : guide() ? `<span class="ptbox">/ ${esc(fmtNum(Math.round(num(n.points))))}</span>`
    : `<span class="ptbox" title="Marks">/ <input class="pt-in" data-item="${esc(id)}" data-f="${f("points")}" data-t="num" value="${esc(fmtNum(n.points))}" inputmode="numeric" aria-label="Marks"></span>`;
  const h = [`<div class="pq-line">${depth === 0 ? `<b>${label}</b>` : `<span class="pl">${label}</span>`}${pts}<div class="pq-text">${richIn(id, f("body"), n.body, n.comps, has ? "Introduction (optional)" : "Type the question…", "q-body")}</div></div>`];
  if (has) {
    n.parts.forEach((p, j) => {
      const pp = `${path ? path + "." : ""}parts.${j}`, sel = ui.sel === id && ui.path === pp ? " sel" : "";
      h.push(`<div class="pq-part sub${sel}" data-sel="${esc(id)}" data-path="${pp}">${nodeHTML(p, { ...ctx, depth: depth + 1, label: partLabel(depth + 1, j), path: pp })}</div>`);
    });
    if (!guide()) h.push(`<button type="button" class="add-sub" data-act="subadd" data-item="${esc(id)}" data-p="${path}">+ Add ${partLabel(depth + 1, n.parts.length)}</button>`);
    return h.join("");
  }
  if (n.type === "tf") h.push(`<div class="pq-tf">${["true", "false"].map(x => `<span><button type="button" class="dot${n.answer === x ? " right" : ""}${n.answer === x && showSol ? " on" : ""}" data-act="tf" data-v="${x}" data-item="${esc(id)}" data-p="${path}" title="Mark ${x === "true" ? "True" : "False"} as the answer"></button>${x === "true" ? "True" : "False"}</span>`).join("")}</div>`);
  if (n.type === "mc" || n.type === "ms") {
    h.push(`<div class="pq-opts lay-${n.layout}">${n.options.map((o, j) => `<div class="opt-row"><button type="button" class="${n.type === "ms" ? "sq" : "dot"}${o.correct ? " right" : ""}${o.correct && showSol ? " on" : ""}" data-act="optok" data-j="${j}" data-item="${esc(id)}" data-p="${path}" title="${o.correct ? "Correct answer" : "Mark as correct"}"></button>
        ${richIn(id, f(`options.${j}.text`), o.text, null, `Option ${j + 1}`, "opt-text")}
        ${guide() ? "" : `<button type="button" class="ic sm trash opt-x" data-act="optdel" data-j="${j}" data-item="${esc(id)}" data-p="${path}" title="Delete this option" aria-label="Delete this option">${svg("trash")}</button>`}</div>`).join("")}
      ${guide() ? "" : `<button type="button" class="add-opt" data-act="optadd" data-item="${esc(id)}" data-p="${path}">+ Option</button>`}</div>`);
  }
  if (showSol) h.push(`<div class="pq-sol"><b>${n.type === "written" ? "Solution." : "Explanation."}</b>${richIn(id, f("solution"), n.solution, null, n.type === "written" ? "Type the solution…" : "Optional explanation…", "sol-body")}</div>`);
  if (showMark) h.push(rubricHTML(n, id, f, path, item));
  // The answer space on the page: drag its bottom edge to resize it; its
  // other settings are on the edit bar. With none, a link adds one.
  const sp = n.space;
  if (sp.mode === "fill") h.push(`<div class="pq-fill-ed"><span>Rest of the page</span></div>${pageLine("New page")}`);
  else if (handout()) {}
  else if (sp.mode === "height" && mode !== "guide") h.push(`<div class="pq-space ed" style="height:${esc(cm(sp.h))}" data-item="${esc(id)}" data-f="${f("space.h")}"><i class="sp-h" title="Drag to resize"></i></div>`);
  else if (sp.mode === "none" && mode !== "guide") h.push(`<button type="button" class="add-space" data-act="sp" data-v="height" data-item="${esc(id)}" data-p="${path}">+ Answer space</button>`);
  return h.join("");
}
function rubricHTML(n, id, f, path, item) {
  const P = num(n.points);
  return `<div class="pq-mark" data-rbof="${esc(id)}|${path}"><b>Marking.</b> <button type="button" class="mode-btn" data-act="marking" data-item="${esc(id)}" title="Switch between start at full and start at zero">${item.marking === "zero" ? "Start at zero" : "Start at full"}</button>
    <div class="rb-rows">${n.rubric.map((c, j) => `<div class="rb-line">
      <input class="rb-d ${num(c.delta) < 0 ? "neg" : num(c.delta) > 0 ? "pos" : ""}" inputmode="decimal" data-item="${esc(id)}" data-f="${f(`rubric.${j}.delta`)}" data-t="num" value="${num(c.delta) > 0 ? "+" : ""}${fmtNum(c.delta)}" aria-label="Points">
      <input class="rb-t" data-item="${esc(id)}" data-f="${f(`rubric.${j}.text`)}" value="${esc(c.text)}" placeholder="Comment" aria-label="Comment">
      <button type="button" class="ic sm trash" data-act="rbdel" data-j="${j}" data-item="${esc(id)}" data-p="${path}" title="Delete this rubric line" aria-label="Delete this rubric line">${svg("trash")}</button></div>`).join("")}</div>
    <div class="rb-adds"><button type="button" class="link" data-act="rbadd" data-item="${esc(id)}" data-p="${path}">+ Comment</button><button type="button" class="link" data-act="rbfull" data-item="${esc(id)}" data-p="${path}">+ “${item.marking === "zero" ? "Fully correct" : "Correct"}”</button>
      <span class="rb-warn">${rbWarn(n, item)}</span></div></div>`;
}
const rbWarn = (n, q) => rubricIssues(n.rubric, num(n.points), q.marking).map(t => `<span class="warnt">${esc(t[0].toUpperCase() + t.slice(1))}.</span>`).join(" ");
// The last thing a question prints ends the page when its space is "rest of the page".
function endsWithFill(n) { return n.parts.length ? endsWithFill(n.parts[n.parts.length - 1]) : n.space.mode === "fill"; }

// ── Cover page, edited in place ──────────────────────────────────────
function pointsTableHTML(vi) {
  const nums = numbering(), qs = model.items.map((it, i) => [it, i]).filter(([it]) => isQ(it));
  if (!qs.length) return `<table class="cv-pts"><tr><td>Points table: appears once there are questions</td></tr></table>`;
  return `<table class="cv-pts"><tr><td>Question:</td>${qs.map(([, i]) => `<td>${nums[i]}</td>`).join("")}<td><b>Total</b></td></tr>

// Student-info rows as the class draws them: rows of character boxes, two

function fieldsHTML(fields) {
  const boxes = (n, j) => `<div class="bxrow" data-act="field" data-j="${j}" title="Click to change">${Array.from({ length: Math.min(40, Math.max(1, Math.round(num(n)))) }, () => "<i></i>").join("")}</div>`;

const ZOOMS = [0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5];
// Fit (fill the window's width) is the default and follows the window as it
// resizes; picking a size with − or + keeps that size instead.
const fitZoom = () => Math.min(2.5, Math.max(0.5, (document.documentElement.clientWidth - 140) / 816));
ui.zoomFit = (() => { try { const v = localStorage.getItem("exam-builder.zoom"); return v === null || v === "fit"; } catch (_) { return true; } })();
ui.zoom = ui.zoomFit ? Math.round(fitZoom() * 100) / 100 : (() => { try { return Math.min(2.5, Math.max(0.5, num(localStorage.getItem("exam-builder.zoom")) || 1)); } catch (_) { return 1; } })();
const zoomHTML = () => `<div class="zoom" role="group" aria-label="Zoom">
    <button type="button" data-act="zoom" data-v="-1" title="Smaller" aria-label="Zoom out">−</button>
    <button type="button" class="zpct" data-act="zoom" data-v="0" title="Back to 100%">${Math.round(ui.zoom * 100)}%</button>
    <button type="button" data-act="zoom" data-v="1" title="Bigger" aria-label="Zoom in">+</button>
    <button type="button" class="zfit" data-act="zoom" data-v="fit" title="Fill the window's width" aria-pressed="${!!ui.zoomFit}">Fit</button></div>`;
function applyZoom() { const sh = $(".shell"); if (sh) sh.style.setProperty("--zoom", ui.zoom); }
function setZoom(z, fit = false) {
  ui.zoomFit = fit;
  const sheet = $("#sheet"), before = sheet ? sheet.getBoundingClientRect() : null, mid = innerHeight / 2;
  const frac = before ? (mid - before.top) / before.height : 0;   // keep the middle of the screen on the same spot of the page
  ui.zoom = Math.round(Math.min(2.5, Math.max(0.5, z)) * 100) / 100;
  try { localStorage.setItem("exam-builder.zoom", fit ? "fit" : ui.zoom); } catch (_) {}
  const fb = $(".zfit"); if (fb) fb.setAttribute("aria-pressed", fit);
  applyZoom(); closePops(); drawFloat();
  const p = $(".zpct"); if (p) p.textContent = `${Math.round(ui.zoom * 100)}%`;
  if (before) { const after = sheet.getBoundingClientRect(); window.scrollBy(0, after.top + frac * after.height - mid); }
}

  const i = ZOOMS.findIndex(z => z >= ui.zoom - 1e-6), cur = i < 0 ? ZOOMS.length - 1 : i;
  setZoom(+v > 0 ? ZOOMS[Math.min(ZOOMS.length - 1, ZOOMS[cur] > ui.zoom + 1e-6 ? cur : cur + 1)] : ZOOMS[Math.max(0, cur - 1)]);
}
addEventListener("resize", () => { if (ui.zoomFit && $("#sheet") && !stage.hidden) setZoom(fitZoom(), true); });

addEventListener("wheel", e => {
  if (!(e.ctrlKey || e.metaKey) || !$("#sheet") || stage.hidden || $("#sheet").hidden || !stage.contains(e.target)) return;
  e.preventDefault();
  setZoom(ui.zoom * Math.exp(-Math.max(-120, Math.min(120, e.deltaY)) * 0.0015));

const TYPE_SHORT = { written: "Written", mc: "Multiple choice", tf: "True/false" };
// ── The edit bar: under the top bar, it shows the tools for whatever is

ui.field = null;   // the student field being edited on the cover
const ctx = $("#ctx");
const sel2 = (cls, opts, cur, label) => `<label class="cx-sel"><span>${label}</span><select class="${cls}">${opts.map(([v, l]) => `<option value="${v}"${String(v) === String(cur) ? " selected" : ""}>${l}</option>`).join("")}</select></label>`;
function placeToolbar() {
  $$("#sheet .fsel").forEach(e => e.classList.remove("fsel"));
  if (ui.sel === "cover" && ui.field != null) $$(`#sheet [data-fj="${ui.field}"]`).forEach(e => e.classList.add("fsel"));
  if (ctx.contains(document.activeElement) && document.activeElement.matches("input[type=number], input[type=text]")) return;   // don't redraw the bar under your typing
  const groups = [];
  if (ui.output === "preview") groups.push(`<span class="cx-name">Student Preview</span><span class="cx-hint">The exam as students see it. Click the eye again to go back to editing.</span>`);
  else if (ui.output === "settings") groups.push(`<span class="cx-name">Settings</span><span class="cx-hint">Changes apply straight away. Click the gear again to go back to the exam.</span>`);
  else if (ui.sel === "cover" && guide()) groups.push(`<span class="cx-name">Cover page</span><span class="cx-hint">Untick Show Marking Guide to edit the cover.</span>`);
  else if (ui.sel === "cover") {
    const F = model.cover.fields, j = ui.field, f = j != null ? F[j] : null;
    if (f) {
      $$(`#sheet [data-fj="${j}"]`).forEach(e => e.classList.add("fsel"));
      groups.push(`<span class="cx-name">Student field</span>`,
        `<label class="cx-num"><input type="number" class="cx-fcount" min="1" max="40" value="${esc(f.count)}"> boxes</label>`,
        j > 0 ? `<label class="tb-check"><input type="checkbox" class="cx-fbeside"${f.beside ? " checked" : ""}> Beside the one above</label>` : "",
        `<i></i>${tb("fmove", "up", "Move up", `data-v="-1"${j === 0 ? " disabled" : ""}`)}${tb("fmove", "down", "Move down", `data-v="1"${j === F.length - 1 ? " disabled" : ""}`)}`,
        `<button type="button" class="tb-w danger" data-act="frm">Remove field</button>`,
        `<span class="spacer"></span><button type="button" class="tb-w" data-act="field-done">Done</button>`);
    } else groups.push(`<span class="cx-name">Cover page</span>`,
      `<button type="button" class="tb-w" data-act="m-field-add">${pic("plus")}Student field</button><i></i>`,
      `<label class="tb-check"><input type="checkbox" data-cover="pointsTable"${model.cover.pointsTable ? " checked" : ""}> Points table</label>`,
      model.cover.pointsTable ? `<label class="tb-check cx-sub"><input type="checkbox" data-cover="scoreRow"${model.cover.scoreRow !== false ? " checked" : ""}> Score row</label>` : "",
      `<label class="tb-check"><input type="checkbox" data-cover="instructionsOn"${model.cover.instructionsOn !== false ? " checked" : ""}> Instructions</label>`,
      `<label class="tb-check"><input type="checkbox" data-cover="goodLuck"${model.cover.goodLuck ? " checked" : ""}> “Good luck!”</label>`,
      `<span class="cx-hint">Click a row of boxes to change it.</span><span class="spacer"></span><button type="button" class="tb-w danger" data-act="cover-off">Remove cover</button>`);
  } else if (ui.sel && guide()) {
    const it = itemById(ui.sel);
    if (it && isQ(it)) groups.push(`<span class="cx-name">Question ${numbering()[selIndex()]}${partPath(ui.path)}</span><span class="cx-hint">Solution:</span>${fmtButtons(false)}<span class="spacer"></span><span class="cx-hint">Only solutions and marking are edited here.</span>`);
    else groups.push(`<span class="cx-hint">In the marking guide only the solutions and marking can be edited. Untick Show Marking Guide to change the rest.</span>`);
  } else if (ui.sel) {
    const it = itemById(ui.sel); if (!it) return clearBar();
    if (isQ(it)) {
      const n = nodeAt(it, ui.path), has = n.parts.length > 0, depth = ui.path ? ui.path.split(".").length / 2 : 0;
      const choice = !has && (n.type === "mc" || n.type === "ms"), N = model.settings.versions, nv = it.variants.length, vi = ui.version;
      groups.push(`<span class="cx-name">Question ${numbering()[selIndex()]}${partPath(ui.path)}</span>`,
        has ? "" : `<button type="button" class="tb-w" data-act="m-type" title="Change the answer type">${pic(typeKey(n.type))}${TYPE_SHORT[typeKey(n.type)]}${pic("caret")}</button>`,
        choice ? `<button type="button" class="tb-w" data-act="m-layout" title="Layout of the options, and multiple answers">${pic(n.layout)}${pic("caret")}</button>` : "",
        `<i></i>${fmtButtons(true)}<i></i>`,
        `<button type="button" class="tb-w" data-act="subadd-sel" title="Add a sub-question: (a), (b)… or (i), (ii)…">${pic("sub")}Sub-question</button><i></i>`,
        !has && n.space.mode !== "none" && !handout() ? spaceBar(it, n) : "",
        depth === 0 ? `<label class="tb-check"><input type="checkbox" class="cx-newpage"${it.newPage ? " checked" : ""}> New page</label>` : "",
        depth === 0 && N > 1 ? (nv === 1 ? `<button type="button" class="tb-w" data-act="ownvar">Own variant for version ${LET(vi === 0 ? 1 : vi)}</button>` : `<button type="button" class="tb-w danger" data-act="delvar">Remove variant ${LET(Math.min(vi, nv - 1))}</button>`) : "",
        depth > 0 ? `<i></i>${tb("pmove", "up", "Move up", 'data-v="-1"')}${tb("pmove", "down", "Move down", 'data-v="1"')}<button type="button" class="tb-w danger" data-act="pdel">Delete part</button>` : "");
    } else if (it.kind === "page") groups.push(`<span class="cx-name">Content page</span><i></i>${fmtButtons(false)}`);
    else groups.push(`<span class="cx-name">${it.kind === "rough" ? "Rough-work page" : "Page break"}</span><span class="cx-hint">Move it with the arrows beside it, or delete it with the bin.</span>`);
  }
  if (!groups.length) return clearBar();
  ctx.classList.remove("empty");
  ctx.innerHTML = `<div class="cx-in">${groups.filter(Boolean).join("")}${viewCtl()}</div>`;
}
// The right end of the edit bar: which version is shown, and the marking guide on or off.
function viewCtl() {

  const N = model.settings.versions;
  return `<span class="cx-view">${N > 1 ? `<label class="cx-sel"><span>Showing</span><select class="ver-sel" id="ver-sel" aria-label="Version shown">${Array.from({ length: N }, (_, k) => `<option value="${k}"${k === ui.version ? " selected" : ""}>Version ${LET(k)}</option>`).join("")}</select></label>` : ""}
</span>`;
}
// Answer space on the edit bar: a height in half-centimetre steps, or the rest of the page, or none.
function spaceBar(it, n) {
  const on = `data-item="${esc(it.id)}" data-p="${ui.path}"`, fill = n.space.mode === "fill";
  return `${fill ? `<button type="button" class="tb-w" data-act="sp" data-v="height" ${on}>Set a height</button>`
      : `<span class="cx-step">${tb("sp", "minus", "Half a centimetre less", `data-v="-0.5" ${on}`)}<b>${fmtNum(parseFloat(n.space.h) || 4)}<small>cm</small></b>${tb("sp", "plus", "Half a centimetre more", `data-v="0.5" ${on}`)}</span>
         <button type="button" class="tb-w" data-act="sp" data-v="fill" ${on}>Rest of page</button>`}
    ${tb("sp", "x", "No answer space", `data-v="none" ${on}`)}<i></i>`;
}
function clearBar() {
  const S = model.settings, lay = S.layout || "exam";
  ctx.classList.add("empty");
  ctx.innerHTML = ui.output === "preview" ? `<div class="cx-in"><span class="cx-name">Student Preview</span><span class="cx-hint">The exam as students see it. Click the eye again to go back to editing.</span>${viewCtl()}</div>`
    : `<div class="cx-in"><div class="seg cx-seg" role="group" aria-label="Exam or handout">${[["exam", "Exam"], ["handout", "Handout"]].map(([v, l]) => `<button type="button" data-act="set-layout" data-v="${v}" aria-pressed="${lay === v}">${l}</button>`).join("")}</div><i></i>
      <label class="cx-sel"><span>Versions</span><select id="set-ver-n">${[1, 2, 3, 4, 5, 6].map(k => `<option value="${k}"${S.versions === k ? " selected" : ""}>${k}</option>`).join("")}</select></label><i></i>
      <label class="tb-check"><input type="checkbox" id="set-pnum"${S.pageNumbers ? " checked" : ""}> Page Numbers</label>
${viewCtl()}</div>`;
}
const partPath = path => { let s = ""; (path ? path.split(".") : []).forEach((x, k) => { if (k % 2) s += partLabel((k + 1) / 2, +x); }); return s ? ` ${s}` : ""; };
// The edit bar keeps the cursor where it is, and its buttons use the same actions as the page.
ctx.addEventListener("mousedown", e => { if (e.target.closest(".tb-b, .tb-w")) e.preventDefault(); });
ctx.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b && !b.disabled) act(b, e); });
$("#float").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b && !b.disabled) act(b, e); });
ctx.addEventListener("change", e => {
  const t = e.target, F = model.cover.fields, f = ui.field != null ? F[ui.field] : null;
  if (t.id === "show-guide") { ui.output = t.checked ? "guide" : "student"; return render(); }
  if (t.id === "ver-sel") { ui.version = +t.value; return render(); }
  if (t.id === "set-ver-n") return change(() => { model.settings.versions = +t.value; });

  if (t.matches(".cx-fcount") && f) return change(() => { f.count = Math.min(40, Math.max(1, Math.round(num(t.value)) || 1)); });
  if (t.matches(".cx-fbeside") && f) return change(() => { f.beside = t.checked; });
  const it = ui.sel && ui.sel !== "cover" ? itemById(ui.sel) : null; if (!it || !isQ(it)) return;
  if (t.matches(".cx-newpage")) return change(() => { it.newPage = t.checked; });

// Typing a number of boxes updates the page as you go.
ctx.addEventListener("input", e => {
  const t = e.target; if (!t.matches(".cx-fcount") || ui.field == null || !(num(t.value) > 0)) return;
  const f = model.cover.fields[ui.field]; noteTyping();

stage.addEventListener("mousedown", e => { if (e.target.closest(".tb-b, .tb-w")) e.preventDefault(); });

// ── Popovers ─────────────────────────────────────────────────────────
// ── Menus (the same in every tool of the suite) ───────────────────────
// A menu opens under its button (above it if there's no room), lined up with its
// edge. One opened from a bar that stays put (top, edit or bottom bar) stays put too
// and closes if the page scrolls; one opened from something on the page moves with
// it. Its own button again, Esc, or a click elsewhere closes it.
function popover(anchor, html, bind, cls = "") {
  const open = $(".fpop");
  if (open && open._anchor === anchor) { closePops(); return null; }
  closePops();
  const el = document.createElement("div");
  el.className = `fpop ${cls}`; el.innerHTML = html; el._anchor = anchor;
  const pinned = !!anchor.closest(".tb, .ctx, .dock");
  el.style.position = pinned ? "fixed" : "absolute";
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.max(8, Math.min(innerWidth - w - 8, r.left + w > innerWidth - 8 ? r.right - w : r.left));
  const top = r.bottom + 6 + h > innerHeight - 8 && r.top - h - 6 > 8 ? r.top - h - 6 : r.bottom + 6;
  el.style.left = `${left + (pinned ? 0 : scrollX)}px`; el.style.top = `${top + (pinned ? 0 : scrollY)}px`;
  anchor.setAttribute("aria-expanded", "true");
  if (bind) bind(el);
  const f = $("input:not([type=checkbox]), textarea", el); if (f) { f.focus(); if (f.select) f.select(); }
  return el;
}
function closePops() { $$(".fpop").forEach(e => { const f = e._onClose; e._onClose = null; if (e._anchor) e._anchor.removeAttribute("aria-expanded"); e.remove(); if (f) f(); }); }
document.addEventListener("mousedown", e => { const p = $(".fpop"); if (!p || e.target.closest(".fpop")) return; if (p._anchor && p._anchor.contains(e.target)) return; closePops(); });   // its own button toggles it (on click)
// (Esc: the Exam Builder's own key handler closes a menu first, before clearing the selection.)
addEventListener("resize", () => closePops());
addEventListener("scroll", e => { const p = $(".fpop"); if (p && p.style.position === "fixed" && !(e.target.closest && e.target.closest(".fpop"))) closePops(); }, true);

// ── Typing on the page ───────────────────────────────────────────────
let lastRange = null, derivedTimer = 0;
const refreshSoon = () => { clearTimeout(derivedTimer); derivedTimer = setTimeout(refreshDerived, 150); };
document.addEventListener("selectionchange", () => {
  const s = getSelection(); if (!s.rangeCount) return;
  const r = s.getRangeAt(0), host = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentNode;
  const rich = host && host.closest && host.closest(".ed.rich");
  if (!rich) return;
  activeRich = rich;
  if (host.closest(".mchip, .tikz, .codeblk")) return;   // the cursor is inside maths or a figure, not the text
  lastRange = r.cloneRange();
  const bar = $("#ctx");
  if (bar) ["bold", "italic", "underline", "insertUnorderedList", "insertOrderedList"].forEach(c => { const b = $(`[data-v="${c}"]`, bar); if (b) b.setAttribute("aria-pressed", document.queryCommandState(c)); });
});
const fieldParent = path => (path.includes(".") ? path.slice(0, path.lastIndexOf(".")) : "");
// Read an editable back into the model.
function syncEd(el) {
  const owner = itemById(el.dataset.item); if (!owner) return;
  const f = el.dataset.f;
  noteTyping();
  if (el.classList.contains("rich")) {
    setP(owner, f, richToTex(el));
    if (el.hasAttribute("data-comps")) {
      const node = getP(owner, fieldParent(f)), keep = new Set([...node.body.matchAll(TOKEN)].map(m => m[1]));
      Object.keys(node.comps).forEach(id => { if (!keep.has(id)) delete node.comps[id]; });
    }
  } else if (el.classList.contains("lines")) {
    if (!$("li", el)) el.innerHTML = "<li><br></li>";
    setP(owner, f, $$("li", el).map(li => li.innerText.trim()).filter(Boolean).join("\n"));
    const row = el.closest(".mrow, .cv-ins"); if (row) row.classList.toggle("empty", !getP(owner, f));
  } else {
    const v = el.innerText.replace(/\s*\n\s*/g, " ").trim();
    setP(owner, f, v);
    $$(`#sheet .ed.plain[data-item="${el.dataset.item}"][data-f="${f}"]`).forEach(o => { if (o !== el) o.textContent = v; });   // the same setting shown twice
    const row = el.closest(".mrow"); if (row) row.classList.toggle("empty", !v);
  }
  refreshSoon();
}
stage.addEventListener("input", e => {
  const t = e.target;
  const ed = t.closest && t.closest(".ed"); if (ed && stage.contains(ed)) return syncEd(ed);
  if (t.matches("input[data-f]")) {   // marks, rubric
    const owner = itemById(t.dataset.item); if (!owner) return;
    noteTyping(); setP(owner, t.dataset.f, t.dataset.t === "num" ? num(t.value) : t.value);
    if (t.classList.contains("rb-d")) { const d = num(t.value); t.classList.toggle("neg", d < 0); t.classList.toggle("pos", d > 0); }
    refreshSoon();
  }
});
stage.addEventListener("keydown", e => {
  const ed = e.target.closest && e.target.closest(".ed");
  if (!ed) { if (e.key === "Enter" && e.target.matches("input[data-f]")) e.target.blur(); return; }
  if (e.key === "Enter" && (ed.classList.contains("plain") || ed.classList.contains("opt-text"))) { e.preventDefault(); ed.blur(); }
  if (e.key === "Tab" && e.target.closest(".tikz-code, .code-code")) { e.preventDefault(); document.execCommand("insertText", false, e.target.closest(".code-code") ? "    " : "  "); return; }   // 4 spaces in code, 2 in TikZ
  if (e.key === "Tab" && ed.classList.contains("rich")) { e.preventDefault(); document.execCommand(e.shiftKey ? "outdent" : "indent"); }
});
stage.addEventListener("paste", e => {
  const ed = e.target.closest && e.target.closest(".ed"); if (!ed) return;
  e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain"));
});
stage.addEventListener("focusin", e => {
  const ed = e.target.closest && e.target.closest(".ed.rich"); if (ed) activeRich = ed;
  const blk = e.target.closest && e.target.closest("[data-sel]"); if (blk && $("#sheet").contains(blk)) select(blk.dataset.sel, blk.dataset.path || "");
  const fr = e.target.closest && e.target.closest("[data-fj]"); if (fr && ui.field !== +fr.dataset.fj) { ui.field = +fr.dataset.fj; placeToolbar(); }
});

function placeInRich(el, node) {
  let r = lastRange && el.contains(lastRange.startContainer) ? lastRange : null;
  if (!r) { r = document.createRange(); r.selectNodeContents(el); r.collapse(false); }
  r.deleteContents(); r.insertNode(node); r.setStartAfter(node); r.collapse(true);
  el.focus(); const s = getSelection(); s.removeAllRanges(); s.addRange(r); lastRange = r.cloneRange();
}
const nodeFrom = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
// The text box the toolbar should act on: the one last typed in, if it's in the selected block.
function targetRich(needComps) {
  const blk = selEl(); if (!blk) return null;
  const own = r => r && r.isContentEditable && blk.contains(r) && !$$(".pq-part.sub", blk).some(s => s.contains(r));
  if (activeRich && own(activeRich) && (!needComps || activeRich.hasAttribute("data-comps"))) return activeRich;
  return $$(needComps ? ".ed.rich[data-comps]" : ".ed.rich", blk).find(own) || null;

// ── Answer components, maths and LaTeX chips ─────────────────────────
function compOwner(chip) { const rich = chip.closest(".ed.rich"), it = itemById(rich.dataset.item); return { rich, it, node: getP(it, fieldParent(rich.dataset.f)) }; }

  const { rich, it, node } = compOwner(chip), id = chip.dataset.c, c = node.comps[id]; if (!c) return;

  const size = c.kind === "blank" ? field("len", "Length", " s") : c.kind === "box" ? field("w", "Width", " s") + field("h", "Height", " s") : c.kind === "cells" ? field("n", "Cells", " s") + field("cell", "Cell size", " s") : field("w", "Width", " s");
  const ans = c.kind === "frac" ? field("num", "Top") + field("den", "Bottom") : field("ans", c.kind === "cells" ? "Answers, separated by commas" : "Answer");
  popover(chip, `<div class="fp-h">${pic(c.kind)}${COMPS[c.kind].label}</div><div class="fp-row">${ans}</div>${guide() ? "" : `<div class="fp-row">${size}</div>`}
      <div class="fp-f">${guide() ? "" : `<button type="button" class="link danger" data-pa="rm">Remove</button>`}<span class="spacer"></span><button type="button" class="btn" data-pa="done">Done</button></div>`, pop => {
    let first = true;
    pop.addEventListener("input", e => {
      const k = e.target.dataset.c; if (!k) return;
      if (first) { pushUndo(); first = false; }
      c[k] = k === "n" ? num(e.target.value) : e.target.value; unsaved = true;
      chip.innerHTML = compHTML(c); refreshSoon();
    });
    pop.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); closePops(); } });
    $('[data-pa="done"]', pop).onclick = closePops;
    const rm = $('[data-pa="rm"]', pop); if (rm) rm.onclick = () => { closePops(); chip.remove(); syncEd(rich); };

}
function editChip(chip, isNew) {   // a LaTeX chip: its source in a small box
  const rich = chip.closest(".ed.rich");
  popover(chip, `<div class="fp-h">${pic("tex")}LaTeX</div>
      <textarea class="src" spellcheck="false" rows="5" placeholder="Any LaTeX">${esc(chip.dataset.src)}</textarea>
      <div class="fp-f"><button type="button" class="link danger" data-pa="rm">Remove</button><span class="spacer"></span><button type="button" class="btn" data-pa="done">Done</button></div>`, pop => {
    const ta = $("textarea", pop);
    ta.addEventListener("input", () => { const fresh = nodeFrom(rawChip(ta.value)); chip.replaceWith(fresh); chip = fresh; syncEd(rich); });
    ta.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closePops(); } });
    $('[data-pa="done"]', pop).onclick = closePops;
    $('[data-pa="rm"]', pop).onclick = () => { chip.remove(); syncEd(rich); closePops(); };
    pop._onClose = () => { if (!chip.dataset.src.trim() && chip.isConnected) { chip.remove(); syncEd(rich); } };
    if (isNew) { pushUndo(); clearTimeout(typingTimer); typingTimer = 0; }
  });
}

// Maths is edited where it sits: the chip turns into its $…$ source, and
// renders again when you click away (or press Enter or Esc).
function startMath(chip) {
  if (chip.classList.contains("editing")) return;
  closePops();
  chip.classList.add("editing");
  chip.innerHTML = `<span class="m-src" contenteditable="plaintext-only" spellcheck="false">${esc(chip.dataset.src)}</span><button type="button" class="m-disp" tabindex="-1" title="On its own line" aria-pressed="${chip.dataset.display === "1"}">${pic("display")}</button>`;
  const src = $(".m-src", chip), rich = chip.closest(".ed.rich");
  src.addEventListener("input", () => { chip.dataset.src = src.innerText.replace(/\n/g, " "); });   // then the text box syncs (the event bubbles)
  src.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finishMath(chip, true); } });
  src.addEventListener("blur", () => setTimeout(() => { if (!chip.contains(document.activeElement)) finishMath(chip); }, 0));
  $(".m-disp", chip).addEventListener("mousedown", e => {
    e.preventDefault(); e.stopPropagation();
    const on = chip.dataset.display !== "1";
    chip.dataset.display = on ? "1" : "0"; chip.classList.toggle("block", on); e.currentTarget.setAttribute("aria-pressed", on);
    syncEd(rich);
  });
  src.focus();
  const r = document.createRange(); r.selectNodeContents(src); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function finishMath(chip, keepCaret) {
  if (!chip.isConnected || !chip.classList.contains("editing")) return;
